apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: inference
  namespace: argocd
  labels:
    app.kubernetes.io/name: inference
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: e2e-rag-system
  annotations:
    description: Inference services (frontend, retriever, cloudflared)
    deployed-at: "2026-05-17T12:34:04Z"
    aws-region: "ap-south-1"
spec:
  project: default
  source:
    repoURL: https://github.com/Athithya-Sakthivel/E2E-RAG-System.git
    targetRevision: main
    path: src/infra/helm/inference_svc
    helm:
      values: |
        frontend:
          image: "681802563986.dkr.ecr.ap-south-1.amazonaws.com/frontend:staging"
          serviceAccount:
            annotations:
              eks.amazonaws.com/role-arn: "arn:aws:iam::681802563986:role/rag-frontend-irsa-role"
          env:
            # ---- Domain & Microsoft Auth ----
            FRONTEND_HOSTNAME: "rag.athithya.site"
            MS_TENANT_ID: "b8a65a11-9d1c-4d48-b9f6-dabfc67f2e4b"
            GOOGLE_ALLOWED_DOMAINS: "gmail.com"
            MICROSOFT_ALLOWED_DOMAINS: "outlook.com"
            MICROSOFT_ALLOWED_TENANT_IDS: "b8a65a11-9d1c-4d48-b9f6-dabfc67f2e4b"

            # ---- Environment & Logging ----
            ENV: "PROD"
            LOG_LEVEL: "INFO"
            ENABLE_PROMETHEUS: "true"
            PROMETHEUS_PATH: "/metrics"

            # ---- Feature Toggles ----
            REQUIRE_AUTH: "true"
            ENABLE_GOOGLE_AUTH: "true"
            ENABLE_MICROSOFT_AUTH: "true"
            ENABLE_GITHUB_AUTH: "false"
            DISPLAY_SOURCES_IN_UI: "true"
            DISPLAY_TOPK_IN_UI: "false"
            USE_IAM: "true"

            # ---- JWT Configuration ----
            JWT_ISS: "stateless-openid-auth"
            JWT_AUD: "rag-ui"
            JWT_TTL_SECONDS: "900"
            JWT_CLOCK_SKEW_SECONDS: "90"
            JWT_KID: "production-key-1"

            # ---- GitHub Auth ----
            GITHUB_ALLOWED_ORGS: ""

            # ---- Service Endpoints ----
            RETRIEVER_URL: "http://retriever.inference.svc.cluster.local:8001"
            GENERATE_STREAM_PATH: "/generate/stream"
            UPSTREAM_TIMEOUT_SECONDS: "60"
            VALKEY_SERVICE_HOST: "valkey.valkey.svc.cluster.local"
            VALKEY_SERVICE_PORT: "6379"

            # ---- Presigned URLs ----
            ENABLE_PRESIGNED_URLS: "true"
            PRESIGNED_URL_TTL_SECONDS: "3600"

            # ---- Rate Limiting ----
            RATE_LIMIT_GENERATE_STREAM: "5/minute"
            RATE_LIMIT_AUTH_ME: "30/minute"
            RATE_LIMIT_STREAM_CONCURRENCY: "10"
            RATE_LIMIT_AUTH_LOGIN: "10/minute"
            RATE_LIMIT_AUTH_START: "5/minute"
            RATE_LIMIT_AUTH_CALLBACK: "20/minute"
            RATE_LIMIT_AUTH_LOGOUT: "20/minute"

          secrets:
            - frontend-secrets

        retriever:
          image: "681802563986.dkr.ecr.ap-south-1.amazonaws.com/retriever:staging"
          serviceAccount:
            annotations:
              eks.amazonaws.com/role-arn: "arn:aws:iam::681802563986:role/rag-retriever-irsa-role"
          env:
            # ---- Environment ----
            ENV: "PROD"
            LOG_LEVEL: "INFO"
            ENABLE_PROMETHEUS: "true"
            PROMETHEUS_PATH: "/metrics"

            # ---- Service Endpoints ----
            BEDROCK_MODEL_ID: "meta.llama3-8b-instruct-v1:0"
            COLLECTION_NAME: "default_rag_collection1"
            DENSE_URL: "http://fastembed-dense-svc.fastembed.svc.cluster.local:8200"
            SPARSE_URL: "http://fastembed-sparse-svc.fastembed.svc.cluster.local:8201"
            RERANKER_URL: "http://fastembed-reranker-svc.fastembed.svc.cluster.local:8202"
            
            # ---- S3 Configuration ----
            S3_BUCKET: "rag-staging-data-681802563986"
            DATA_S3_BUCKET: "rag-staging-data-681802563986"

            # ---- Presigned URLs ----
            ENABLE_PRESIGNED_URLS: "true"
            PRESIGNED_URL_TTL_SECONDS: "1800"

          secrets:
            - retriever-secrets

        cloudflared:
          tunnel:
            name: "default-tunnel-1"
            tokenSecretName: cloudflared-token
          ingress:
            rules:
              - hostname: rag.athithya.site
                path: /metrics
                service: http_status:403
              - hostname: rag.athithya.site
                path: /healthz
                service: http_status:403
              - hostname: rag.athithya.site
                path: /readyz
                service: http_status:403
              - hostname: rag.athithya.site
                service: http://frontend.inference.svc.cluster.local:8000
                originRequest:
                  connectTimeout: 10s
                  keepAliveTimeout: 30s
                  disableChunkedEncoding: false
              - hostname: argocd.rag.athithya.site
                service: http://argocd-server.argocd.svc.cluster.local:80
                originRequest:
                  connectTimeout: 10s
                  keepAliveTimeout: 30s
              - hostname: grafana.rag.athithya.site
                service: http://grafana.grafana.svc.cluster.local:80
                originRequest:
                  connectTimeout: 10s
                  keepAliveTimeout: 30s
            catchAll: http_status:404
  destination:
    server: https://kubernetes.default.svc
    namespace: inference
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
