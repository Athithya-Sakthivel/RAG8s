# prometheus-application.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/managed-by: argocd
  annotations:
    description: Prometheus + Alertmanager for RAG observability
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus
    targetRevision: 29.6.0
    helm:
      values: |
        global:
          scrape_interval: 15s
          scrape_timeout: 10s
          evaluation_interval: 15s

        rbac:
          create: true

        serviceAccounts:
          server:
            create: true
            name: ""

        alertmanager:
          enabled: true
          replicaCount: 1
          persistentVolume:
            enabled: false
          extraSecretMounts:
            - name: alertmanager-secrets
              mountPath: /etc/alertmanager/secrets
              secretName: alertmanager-secrets
              readOnly: true
          config:
            global:
              resolve_timeout: 5m
            route:
              receiver: 'slack-alerts'
              group_by: ['alertname', 'namespace', 'severity']
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 12h
            inhibit_rules:
              - source_matchers:
                  - alertname = QdrantDown
                target_matchers:
                  - alertname =~ "^(RetrieverHighPipelineLatency|RetrieverDependencyCircuitBreakerOpen|RetrieverHighCacheMissRate|QdrantRestFailureRate|QdrantHighMemoryResident|QdrantConsensusStalled)$"
              - source_matchers:
                  - alertname = RetrieverDown
                target_matchers:
                  - alertname =~ "^(RetrieverHighPipelineLatency|RetrieverDependencyCircuitBreakerOpen|RetrieverHighCacheMissRate|FrontendHighStreamErrorRate)$"
              - source_matchers:
                  - alertname = FrontendDown
                target_matchers:
                  - alertname =~ "^(FrontendHighStreamErrorRate|FrontendHighRateLimitHitRate)$"
            receivers:
              - name: 'slack-alerts'
                slack_configs:
                  - api_url_file: /etc/alertmanager/secrets/slack-api-url
                    channel: '#rag-alerts'
                    username: 'RAG-Monitor'
                    icon_emoji: ':warning:'
                    send_resolved: true
                    title: '{{ .Status | toUpper }}: {{ .CommonLabels.alertname }}'
                    text: |-
                      {{ range .Alerts }}
                      *Severity:* {{ .Labels.severity }}
                      *Summary:* {{ .Annotations.summary }}
                      *Description:* {{ .Annotations.description }}
                      {{ end }}
            templates: []

        kube-state-metrics:
          enabled: false
        prometheus-node-exporter:
          enabled: false
        prometheus-pushgateway:
          enabled: false

        server:
          statefulSet:
            enabled: true
            replicaCount: 1
          persistentVolume:
            enabled: true
            storageClass: "default-storage-class"
            size: 50Gi
            mountPath: /data
          securityContext:
            runAsUser: 65534
            runAsNonRoot: true
            runAsGroup: 65534
            fsGroup: 65534
          containerSecurityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2
              memory: 1Gi
          affinity:
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    labelSelector:
                      matchLabels:
                        app.kubernetes.io/name: prometheus
                        app.kubernetes.io/component: server
                    topologyKey: kubernetes.io/hostname
          strategy:
            type: Recreate
          service:
            enabled: true
            type: ClusterIP
            servicePort: 9090
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 15
            periodSeconds: 10

        extraScrapeConfigs: |
          - job_name: 'retriever'
            metrics_path: /metrics
            static_configs:
              - targets:
                  - 'retriever.inference.svc.cluster.local:8001'
          - job_name: 'frontend-auth'
            metrics_path: /metrics
            static_configs:
              - targets:
                  - 'frontend.inference.svc.cluster.local:8000'
          - job_name: 'cloudflared'
            scrape_interval: 30s
            static_configs:
              - targets:
                  - 'cloudflared-metrics.inference.svc.cluster.local:2000'
          - job_name: 'qdrant'
            scrape_interval: 30s
            metrics_path: /metrics
            static_configs:
              - targets:
                  - 'qdrant-0.qdrant-headless.qdrant.svc.cluster.local:6333'
          - job_name: 'clickhouse'
            scrape_interval: 30s
            metrics_path: /metrics
            static_configs:
              - targets:
                  - 'clickhouse.logging.svc.cluster.local:8001'
          - job_name: 'vector'
            scrape_interval: 30s
            static_configs:
              - targets:
                  - 'vector-metrics.logging.svc.cluster.local:9598'
                  
          - job_name: 'alertmanager'
            scrape_interval: 30s
            static_configs:
              - targets:
                  - 'prometheus-alertmanager.monitoring.svc.cluster.local:9093'
                  
          - job_name: 'fastembed'
            scrape_interval: 30s
            static_configs:
              - targets:
                  - 'rag-dense-model.fastembed:8200'
                  - 'rag-sparse-model.fastembed:8201'
                  - 'rag-reranker-model.fastembed:8202'

        serverFiles:
          alerts:
            groups:
              - name: service_health
                rules:
                  - alert: RetrieverDown
                    expr: absent(up{job="retriever"}) or up{job="retriever"} == 0
                    for: 2m
                    labels: {severity: critical}
                    annotations:
                      summary: "Retriever service is down"
                      description: "Retriever at retriever.inference.svc:8001 has been unreachable for 2 minutes."
                  - alert: FrontendDown
                    expr: absent(up{job="frontend-auth"}) or up{job="frontend-auth"} == 0
                    for: 2m
                    labels: {severity: critical}
                    annotations:
                      summary: "Frontend/Auth service is down"
                      description: "Frontend at frontend.inference.svc:8000 has been unreachable for 2 minutes."
                  - alert: QdrantDown
                    expr: absent(up{job="qdrant"}) or up{job="qdrant"} == 0
                    for: 2m
                    labels: {severity: critical}
                    annotations:
                      summary: "Qdrant peer is down"
                      description: "A Qdrant peer ({{ $labels.instance }}) has been unreachable for 2 minutes."
                  - alert: CloudflaredDown
                    expr: absent(up{job="cloudflared"}) or up{job="cloudflared"} == 0
                    for: 2m
                    labels: {severity: critical}
                    annotations:
                      summary: "Cloudflared tunnel is down"
                      description: "The cloudflared metrics endpoint has been unreachable for 2 minutes."
                  - alert: ClickHouseDown
                    expr: absent(up{job="clickhouse"}) or up{job="clickhouse"} == 0
                    for: 2m
                    labels: {severity: warning}
                    annotations:
                      summary: "ClickHouse is down"
                      description: "ClickHouse at clickhouse.logging.svc.cluster.local:8001 is unreachable."
                  - alert: FrontendNotReady
                    expr: frontend_service_ready == 0
                    for: 2m
                    labels: {severity: critical}
                    annotations:
                      summary: "Frontend service is not ready"
                      description: "The frontend readiness probe has been failing for 2 minutes."
                  - alert: RetrieverNotReady
                    expr: service_ready{service="retriever"} == 0
                    for: 2m
                    labels: {severity: critical}
                    annotations:
                      summary: "Retriever service is not ready"
                      description: "Retriever readiness has been failing for 2 minutes."
                  - alert: VectorDown
                    expr: absent(up{job="vector"}) or up{job="vector"} == 0
                    for: 2m
                    labels: {severity: warning}
                    annotations:
                      summary: "Vector agent is down"
                      description: "Vector metrics endpoint is unreachable."
              - name: retriever_pipeline
                rules:
                  - alert: RetrieverHighPipelineLatency
                    expr: histogram_quantile(0.95, rate(retrieval_pipeline_duration_seconds_bucket[5m])) > 5
                    for: 5m
                    labels: {severity: warning}
                    annotations:
                      summary: "Retriever P95 pipeline latency exceeds 5s"
                      description: "P95 pipeline latency is {{ $value }}s."
                  - alert: RetrieverHighCacheMissRate
                    expr: (sum(rate(retrieval_cache_lookup_total{result="miss"}[5m])) / (sum(rate(retrieval_cache_lookup_total[5m])) + 1)) > 0.9
                    for: 10m
                    labels: {severity: info}
                    annotations:
                      summary: "Retriever cache miss rate above 90%"
                      description: "Cache miss rate is {{ $value | humanizePercentage }}."
                  - alert: RetrieverDependencyCircuitBreakerOpen
                    expr: rate(retrieval_circuit_breaker_open_total[1m]) > 0
                    for: 1m
                    labels: {severity: critical}
                    annotations:
                      summary: "Retriever circuit breaker opened for {{ $labels.dependency }}"
                      description: "Circuit breaker for {{ $labels.dependency }} has opened."
              - name: frontend_auth
                rules:
                  - alert: FrontendHighStreamErrorRate
                    expr: rate(frontend_upstream_stream_errors_total[5m]) / (rate(frontend_requests_total{route="/generate/stream"}[5m]) + 1) > 0.05
                    for: 5m
                    labels: {severity: warning}
                    annotations:
                      summary: "Frontend upstream stream error rate above 5%"
                      description: "{{ $value | humanizePercentage }} of stream requests are failing."
                  - alert: FrontendHighRateLimitHitRate
                    expr: rate(frontend_rate_limit_events_total{outcome="limited"}[5m]) > 0.1
                    for: 10m
                    labels: {severity: info}
                    annotations:
                      summary: "Frontend rate limiting over 0.1 hits/s"
                      description: "Rate limit hits at {{ $value }}/s. Users are being throttled."
              - name: qdrant
                rules:
                  - alert: QdrantDeadReplicas
                    expr: collection_dead_replicas > 0
                    for: 2m
                    labels: {severity: critical}
                    annotations:
                      summary: "Qdrant has dead replica(s)"
                      description: "{{ $value }} replica(s) are non-active."
                  - alert: QdrantRestFailureRate
                    expr: rate(rest_responses_fail_total[5m]) / (rate(rest_responses_total[5m]) + 1) > 0.05
                    for: 5m
                    labels: {severity: warning}
                    annotations:
                      summary: "Qdrant REST failure rate above 5%"
                      description: "{{ $value | humanizePercentage }} of REST calls are failing."
                  - alert: QdrantHighMemoryResident
                    expr: memory_resident_bytes / (1024*1024*1024) > container_spec_memory_limit_bytes / (1024*1024*1024) * 0.85 or memory_resident_bytes / (1024*1024*1024) > 4
                    for: 5m
                    labels: {severity: warning}
                    annotations:
                      summary: "Qdrant peer memory above 85% of limit"
                      description: "Memory resident is {{ printf \"%.1f\" (query \"memory_resident_bytes / (1024*1024*1024)\") }} GiB."
                  - alert: QdrantConsensusStalled
                    expr: rate(cluster_commit[5m]) == 0 and cluster_enabled == 1
                    for: 5m
                    labels: {severity: critical}
                    annotations:
                      summary: "Qdrant Raft consensus stalled"
                      description: "No Raft commits in 5 minutes."
              - name: pod_resources
                rules:
                  - alert: PodCPULimitNearSaturation
                    expr: sum(rate(container_cpu_usage_seconds_total{namespace="inference", container!=""}[5m])) by (pod, container) / sum(container_spec_cpu_quota{namespace="inference", container!=""} / container_spec_cpu_period{namespace="inference", container!=""}) by (pod, container) > 0.9
                    for: 10m
                    labels: {severity: warning}
                    annotations:
                      summary: "Pod {{ $labels.pod }}/{{ $labels.container }} CPU above 90% of limit"
                      description: "CPU utilization is {{ $value | humanizePercentage }} of the limit. Throttling likely."
                  - alert: PodHighMemoryUsage
                    expr: container_memory_working_set_bytes{namespace="inference", container!=""} / container_spec_memory_limit_bytes{namespace="inference", container!=""} > 0.85
                    for: 5m
                    labels: {severity: warning}
                    annotations:
                      summary: "Pod {{ $labels.pod }}/{{ $labels.container }} memory above 85% of limit"
                      description: "Memory utilization is {{ $value | humanizePercentage }} of the limit. Possible OOM risk."
                  - alert: PodOOMKilled
                    expr: increase(container_oom_events_total{namespace="inference", container!=""}[5m]) > 0
                    for: 0m
                    labels: {severity: critical}
                    annotations:
                      summary: "Pod {{ $labels.pod }}/{{ $labels.container }} was OOM-killed"
                      description: "Container has been OOM-killed in the last 5 minutes."
              - name: cloudflared
                rules:
                  - alert: CloudflaredHighHeartbeatRetries
                    expr: cloudflared_tunnel_timer_retries > 5
                    for: 5m
                    labels: {severity: warning}
                    annotations:
                      summary: "Cloudflared tunnel has high heartbeat retries"
                      description: "Heartbeat retries: {{ $value }}."
              - name: clickhouse
                rules:
                  - alert: ClickHouseHighMemoryUsage
                    expr: ClickHouseMetrics_MemoryTracking{job="clickhouse"} / 1e9 > 12
                    for: 5m
                    labels: {severity: warning}
                    annotations:
                      summary: "ClickHouse memory tracking above 12 GB"
                      description: "ClickHouse is using {{ $value }} GB of memory."
                  - alert: ClickHouseReadOnly
                    expr: ClickHouseMetrics_ReadonlyReplica{job="clickhouse"} > 0
                    for: 1m
                    labels: {severity: critical}
                    annotations:
                      summary: "ClickHouse is in read-only mode"
                      description: "ClickHouse has read-only replicas. No inserts possible."
              - name: vector
                rules:
                  - alert: VectorProcessingErrorsHigh
                    expr: rate(vector_component_errors_total{job="vector"}[5m]) > 0.1
                    for: 5m
                    labels: {severity: warning}
                    annotations:
                      summary: "Vector processing errors detected"
                      description: "Vector components are logging errors."
                  - alert: VectorBufferEventsHigh
                    expr: vector_component_buffer_events{job="vector"} > 1000
                    for: 5m
                    labels: {severity: warning}
                    annotations:
                      summary: "Vector buffer events accumulating"
                      description: "Vector has {{ $value }} buffered events. Sink may be slow."

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m

  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /spec/versions
    - group: ""
      kind: ConfigMap
      jsonPointers:
        - /data