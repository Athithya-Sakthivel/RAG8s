# src/argocd/grafana-application.yaml
# Deploys Grafana via stable Helm chart 8.4.8 (Grafana 11.x – no stat panel bug).
# Single-source ArgoCD – only the Helm chart; ConfigMaps are NOT managed by ArgoCD.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: grafana
    targetRevision: 8.4.8
    helm:
      values: |
        admin:
          existingSecret: grafana-admin

        service:
          type: ClusterIP
          port: 80

        persistence:
          enabled: false

        # Sidecar auto-discovers dashboards & datasources from ConfigMaps
        sidecar:
          dashboards:
            enabled: true
            searchNamespace: grafana
            label: grafana_dashboard
            labelValue: "1"
          datasources:
            enabled: true
            searchNamespace: grafana
            label: grafana_datasource
            labelValue: "1"

        env:
          GF_METRICS_ENABLED: "true"
          GF_SERVER_PROTOCOL: http

  destination:
    server: https://kubernetes.default.svc
    namespace: grafana

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true

  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /spec/versions
    - group: ""
      kind: ConfigMap
      jsonPointers:
        - /data