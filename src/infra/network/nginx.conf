worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
    gzip_min_length 1024;

    upstream authentik_upstream {
        server authentik-server.authentik.svc.cluster.local:80;
        keepalive 32;
    }

    upstream retriever_upstream {
        server retriever.inference.svc.cluster.local:8001;
        keepalive 32;
    }

    server {
        listen 8080;
        server_name athithya.site;

        root /usr/share/nginx/html;
        index index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        location = /healthz {
            access_log off;
            add_header Cache-Control "no-store" always;
            return 200 'ok';
        }

        location = /favicon.ico {
            try_files /assets/images/favicon.ico =404;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            access_log off;
            log_not_found off;
        }

        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            access_log off;
            expires 1y;
        }

        location / {
            try_files $uri /index.html;
            add_header Cache-Control "no-cache" always;
        }
    }

    server {
        listen 8080;
        server_name api.athithya.site;

        root /usr/share/nginx/html;
        index index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        location = /healthz {
            access_log off;
            add_header Cache-Control "no-store" always;
            return 200 'ok';
        }

        location = /readyz {
            access_log off;
            add_header Cache-Control "no-store" always;
            return 200 'ok';
        }

        location = /auth/login {
            return 302 https://auth.athithya.site/outpost.goauthentik.io/start?rd=$scheme://$http_host$request_uri;
        }

        location = /auth/logout {
            return 302 https://auth.athithya.site/outpost.goauthentik.io/sign_out?rd=$scheme://$http_host/;
        }

        location ^~ /outpost.goauthentik.io/ {
            proxy_pass http://authentik_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host auth.athithya.site;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
            proxy_set_header Connection "";

            proxy_buffering off;
            proxy_request_buffering off;
        }

        location = /auth_request {
            internal;
            proxy_pass http://authentik_upstream/outpost.goauthentik.io/auth/nginx;
            proxy_http_version 1.1;

            proxy_set_header Host auth.athithya.site;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Connection "";

            proxy_buffering off;
            proxy_request_buffering off;
        }

        location = /generate {
            auth_request /auth_request;
            error_page 401 = @goauthentik_proxy_signin;

            auth_request_set $auth_cookie $upstream_http_set_cookie;
            auth_request_set $authentik_username $upstream_http_x_authentik_username;
            auth_request_set $authentik_email $upstream_http_x_authentik_email;
            auth_request_set $authentik_uid $upstream_http_x_authentik_uid;

            add_header Set-Cookie $auth_cookie always;

            proxy_pass http://retriever_upstream/generate;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Auth-Username $authentik_username;
            proxy_set_header X-Auth-Email $authentik_email;
            proxy_set_header X-Auth-UID $authentik_uid;
            proxy_set_header Connection "";

            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            add_header Cache-Control "no-store" always;
        }

        location = /retrieve {
            auth_request /auth_request;
            error_page 401 = @goauthentik_proxy_signin;

            auth_request_set $auth_cookie $upstream_http_set_cookie;
            auth_request_set $authentik_username $upstream_http_x_authentik_username;
            auth_request_set $authentik_email $upstream_http_x_authentik_email;
            auth_request_set $authentik_uid $upstream_http_x_authentik_uid;

            add_header Set-Cookie $auth_cookie always;

            proxy_pass http://retriever_upstream/retrieve;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Auth-Username $authentik_username;
            proxy_set_header X-Auth-Email $authentik_email;
            proxy_set_header X-Auth-UID $authentik_uid;
            proxy_set_header Connection "";

            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            add_header Cache-Control "no-store" always;
        }

        location = /stream {
            auth_request /auth_request;
            error_page 401 = @goauthentik_proxy_signin;

            auth_request_set $auth_cookie $upstream_http_set_cookie;
            auth_request_set $authentik_username $upstream_http_x_authentik_username;
            auth_request_set $authentik_email $upstream_http_x_authentik_email;
            auth_request_set $authentik_uid $upstream_http_x_authentik_uid;

            add_header Set-Cookie $auth_cookie always;

            proxy_pass http://retriever_upstream/stream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Auth-Username $authentik_username;
            proxy_set_header X-Auth-Email $authentik_email;
            proxy_set_header X-Auth-UID $authentik_uid;
            proxy_set_header Connection "";

            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            chunked_transfer_encoding on;
            gzip off;
            add_header Cache-Control "no-store" always;
        }

        location / {
            auth_request /auth_request;
            error_page 401 = @goauthentik_proxy_signin;

            auth_request_set $auth_cookie $upstream_http_set_cookie;
            auth_request_set $authentik_username $upstream_http_x_authentik_username;
            auth_request_set $authentik_email $upstream_http_x_authentik_email;
            auth_request_set $authentik_uid $upstream_http_x_authentik_uid;

            add_header Set-Cookie $auth_cookie always;
            add_header X-Auth-Username $authentik_username always;
            add_header X-Auth-Email $authentik_email always;
            add_header X-Auth-UID $authentik_uid always;

            try_files $uri /index.html;
            add_header Cache-Control "no-cache" always;
        }

        location @goauthentik_proxy_signin {
            internal;
            return 302 https://auth.athithya.site/outpost.goauthentik.io/start?rd=$scheme://$http_host$request_uri;
        }
    }
}