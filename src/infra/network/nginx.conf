worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile        on;
  tcp_nopush      on;
  tcp_nodelay     on;
  keepalive_timeout 65;
  server_tokens   off;

  client_body_temp_path /tmp/client_body;
  proxy_temp_path       /tmp/proxy;
  fastcgi_temp_path     /tmp/fastcgi;
  uwsgi_temp_path       /tmp/uwsgi;
  scgi_temp_path        /tmp/scgi;

  client_max_body_size 20m;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
  gzip_min_length 1024;

  # Kubernetes DNS. Change only if your cluster DNS IP differs.
  resolver 10.96.0.10 valid=10s ipv6=off;
  resolver_timeout 2s;

  # H2C mitigation: only forward Upgrade when it's websocket.
  # Any other Upgrade values (including h2c) are dropped.
  map $http_upgrade $upgrade_header {
    default "";
    websocket $http_upgrade;
  }
  map $http_upgrade $connection_upgrade {
    default "";
    websocket "Upgrade";
  }

  # Host allowlist keyed by server_name (adjust entries as needed)
  map $server_name $host_allowed {
    default 0;
    athithya.site 1;
    api.athithya.site 1;
  }

  server {
    listen 8080;
    server_name athithya.site api.athithya.site;

    root /usr/share/nginx/html;
    index index.html;

    # Explicit upstream origin and Host header (internal DNS)
    set $retriever_origin http://retriever.inference.svc.cluster.local:8001;
    set $retriever_host retriever.inference.svc.cluster.local;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Reject requests where server_name is not allowed
    if ($host_allowed = 0) {
      return 400;
    }

    location = /healthz {
      access_log off;
      add_header Cache-Control "no-store" always;
      return 200 'ok';
    }

    location = /readyz {
      access_log off;
      add_header Cache-Control "no-store" always;
      return 200 'ok';
    }

    # Ensure trailing slash for /api
    location = /api {
      return 301 /api/;
    }

    # Proxy API paths to retriever backend with safe headers
    location ^~ /api/ {
      add_header Cache-Control "no-store" always;

      rewrite ^/api/?(.*)$ /$1 break;

      proxy_pass $retriever_origin;
      proxy_http_version 1.1;

      # Explicit upstream Host (internal service DNS)
      proxy_set_header Host $retriever_host;

      proxy_set_header X-Request-Id $request_id;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $server_name;
      proxy_set_header X-Real-IP $remote_addr;

      # Only forward Upgrade/Connection for websocket
      proxy_set_header Upgrade $upgrade_header;
      proxy_set_header Connection $connection_upgrade;

      proxy_buffering off;
      proxy_request_buffering off;
      proxy_next_upstream off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      chunked_transfer_encoding on;
      gzip off;
    }

    # Other proxied endpoints use same safe headers
    location ~ ^/(generate/stream|generate|retrieve|stream)/?$ {
      add_header Cache-Control "no-store" always;

      proxy_pass $retriever_origin;
      proxy_http_version 1.1;

      proxy_set_header Host $retriever_host;
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $server_name;
      proxy_set_header X-Real-IP $remote_addr;

      proxy_set_header Upgrade $upgrade_header;
      proxy_set_header Connection $connection_upgrade;

      proxy_buffering off;
      proxy_request_buffering off;
      proxy_next_upstream off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      chunked_transfer_encoding on;
      gzip off;
    }

    # SPA fallback
    location / {
      add_header Cache-Control "no-cache" always;
      try_files $uri $uri/ /index.html;
    }

    location = /favicon.ico {
      try_files /assets/images/favicon.ico =404;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      access_log off;
      log_not_found off;
    }

    location /assets/ {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      access_log off;
      expires 1y;
    }
  }
}
