{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.networkPolicy.name }}
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      {{- include "indexing-cronjob.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.dns.namespace | quote }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Qdrant
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.qdrant.namespace | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.qdrant.port }}
    # Dense embedding service
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.fastembed.namespace | quote }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Values.networkPolicy.fastembed.dense.serviceName | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.fastembed.dense.port }}
    # Sparse embedding service
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.fastembed.namespace | quote }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Values.networkPolicy.fastembed.sparse.serviceName | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.fastembed.sparse.port }}
    # Internet (AWS APIs)
    {{- if .Values.networkPolicy.awsApi.enabled }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.awsApi.port }}
    {{- end }}
{{- end }}