# Default values for indexing-cronjob.

namespace: indexing

serviceAccount:
  name: indexer
  annotations: {}
  # eks.amazonaws.com/role-arn: ""

# Container image – only tag is used; digest is left empty
image:
  registry: 
  repository: 
  tag: ""
  digest: ""                    # <-- EMPTY, no default digest
  pullPolicy: IfNotPresent

networkPolicy:
  enabled: true
  name: indexing-cronjob-egress
  dns:
    namespace: kube-system
  qdrant:
    namespace: qdrant
    port: 6333
  fastembed:
    namespace: fastembed
    dense:
      serviceName: dense
      port: 8200
    sparse:
      serviceName: sparse
      port: 8201
  awsApi:
    enabled: true
    port: 443

cronjob:
  name: indexing-backup-cronjob
  schedule: "0 */6 * * *"
  concurrencyPolicy: Allow
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  backoffLimit: 1
  restartPolicy: Never
  serviceAccountName: indexer   # must match serviceAccount.name
  labels:
    app.kubernetes.io/name: indexing-backup-cronjob
    app.kubernetes.io/component: indexing

command:
  - /opt/venv/bin/python
  - /indexing_pipeline/indexing_pipeline.py
args:
  - --workdir
  - /indexing_pipeline

env:
  PYTHONUNBUFFERED: "1"
  TMPDIR: /tmp
  LOG_LEVEL: INFO
  HTTP_TIMEOUT: "60"
  INDEXING_STRICT: "true"
  RUN_PRE_CONVERSIONS: "false"
  QDRANT_URL: http://qdrant.qdrant.svc.cluster.local:6333
  DENSE_URL: http://dense-svc.fastembed.svc.cluster.local:8200
  SPARSE_URL: http://sparse-svc.fastembed.svc.cluster.local:8201
  S3_BUCKET: ""                # overridden at deploy time
  DATA_S3_BUCKET: ""           # overridden at deploy time
  DATA_S3_PREFIX: data/
  STORAGE_RAW_PREFIX: data/raw/
  STORAGE_CHUNKED_PREFIX: data/chunked/
  MAX_TOKENS_PER_CHUNK: "320"
  MIN_TOKENS_PER_CHUNK: "100"
  NUMBER_OF_OVERLAPPING_SENTENCES: "2"
  PDF_DISABLE_OCR: "false"
  PDF_OCR_ENGINE: rapidocr
  PDF_TESSERACT_LANG: eng
  PDF_FORCE_OCR: "false"
  PDF_OCR_RENDER_DPI: "400"
  PDF_MIN_IMG_SIZE_BYTES: "3072"
  IMAGE_OCR_ENGINE: tesseract
  IMAGE_TESSERACT_LANG: eng
  IMAGE_MIN_IMG_SIZE_BYTES: "3072"
  IMAGE_RENDER_DPI: "400"
  IMAGE_UPSCALE_FACTOR: "2.0"
  TESSERACT_CONFIG: --oem 1 --psm 6
  CSV_TARGET_TOKENS_PER_CHUNK: "400"
  JSONL_TARGET_TOKENS_PER_CHUNK: "400"
  PPTX_SLIDES_PER_CHUNK: "4"
  PPTX_OCR_ENGINE: rapidocr
  COLLECTION_NAME: default_rag_collection1
  DENSE_DIM: "384"
  BATCH_SIZE: "8"
  UPSERT_CHUNK: "500"
  SPARSE_BATCH_FALLBACK: "8"
  QDRANT_SHARD_NUMBER: "3"
  QDRANT_REPLICATION_FACTOR: "2"
  QDRANT_WRITE_CONSISTENCY_FACTOR: "1"
  QDRANT_HNSW_EF_CONSTRUCT: "128"
  QDRANT_HNSW_M: "32"
  QDRANT_HNSW_FULL_SCAN_THRESHOLD: "10000"
  QDRANT_ONDISK: "false"
  QDRANT_ENABLE_SCALAR_QUANTIZATION: "true"
  QDRANT_QUANTIZATION_ALWAYS_RAM: "true"
  INDEX_TIMEOUT: "1800"
  BACKUP_TIMEOUT: "300"
  ENABLE_QDRANT_BACKUP: "true"
  MIN_INDEXED_POINTS_FOR_BACKUP: "100"
  MIN_INDEX_DELTA_RATIO_FOR_BACKUP: "0.0"

resources:
  requests:
    cpu: "500m"
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

# Schedule only on compute nodes and tolerate their taint
nodeSelector:
  node-type: compute

tolerations:
  - key: "node-type"
    operator: "Equal"
    value: "compute"
    effect: "NoSchedule"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL