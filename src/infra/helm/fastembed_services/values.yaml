# GLOBAL SETTINGS - apply to ALL services unless overridden at service level
global:
  createNamespace: true
  networkPolicy:
    enabled: true  # Enable network isolation between services
    allowedNamespaces: [inference, indexing]  # Only these namespaces can communicate
    allowedServiceAccounts: [rag-dense-model, rag-sparse-model, rag-reranker-model]  # Service accounts allowed to call APIs
    # NOTE: DNS, K8s API, and metrics scraping are automatically allowed
  cuda: false  # Master GPU switch. Set true to enable GPU for all services
  logLevel: "info"  # Log verbosity: debug, info, warn, error
  nodeSelector:
    node-type: compute  # Schedule pods on 'compute' nodes. Leave empty to schedule anywhere
  tolerations:    
    - key: "node-type"   # Allow pods on tainted 'compute' nodes
      operator: "Equal"  # Must match taint key/value exactly
      value: "compute"   # Taint value to match
      effect: "NoSchedule"  # Tolerate this scheduling restriction

# DENSE EMBEDDING - Converts text to dense (numerical) vectors
# ServiceAccount: rag-dense-model (auto-created, immutable)
# Metrics exposed at: /metrics on port 8200
dense:
  enabled: true
  embedderImage: ghcr.io/athithya-sakthivel/sparse:2026-05-06-06-26--13b7433@sha256:e977f4eedd896f28de999809eefe8db7c2048dc7fb9f7700d450a333449d334b
  namespace: inference
  modelName: "BAAI/bge-small-en-v1.5"  # HuggingFace model: https://qdrant.github.io/fastembed/examples/Supported_Models/#supported-text-embedding-models
  dim: 384  # Vector dimensions. Must match model output size
  batchSize: 16  # Texts processed at once. Higher = faster, more memory
  gpuCount: 1  # GPUs requested. ONLY used if global.cuda is true
  replicas: 2  # Pod copies for HA. IGNORED if hpa.enabled is true
  hpa:
    enabled: false  # Auto-scale replicas based on CPU
    min: 1  # Minimum pods when idle
    max: 3  # Maximum pods under load
    targetCPU: 60  # Scale up when CPU exceeds 60%
    resources:
      requests:
        cpu: 500m  # CPU requested per pod (guaranteed)
        memory: 1Gi  # Memory requested per pod (guaranteed)
      limits:
        cpu: 2000m  # CPU limit per pod (burstable)
        memory: 2Gi  # Memory limit per pod (max allowed)

# SPARSE EMBEDDING - Converts text to sparse (mostly zeros) vectors
# ServiceAccount: rag-sparse-model (auto-created, immutable)
# Metrics exposed at: /metrics on port 8201
sparse:
  enabled: true
  embedderImage: "myregistry/sparse-embedder:latest"
  namespace: inference
  modelName: "Qdrant/minicoil-v1"  # HuggingFace model: https://qdrant.github.io/fastembed/examples/Supported_Models/#supported-sparse-text-embedding-models
  batchSize: 16  # Texts processed at once. Higher = faster, more memory
  gpuCount: 0  # CPU only (sparse models don't need GPU)
  replicas: 1  # Pod copies. IGNORED if hpa.enabled is true
  hpa:
    enabled: false  # Auto-scale replicas based on CPU
    min: 1  # Minimum pods when idle
    max: 3  # Maximum pods under load
    targetCPU: 60  # Scale up when CPU exceeds 60%
    resources:
      requests:
        cpu: 500m  # CPU requested per pod (guaranteed)
        memory: 1Gi  # Memory requested per pod (guaranteed)
      limits:
        cpu: 2000m  # CPU limit per pod (burstable)
        memory: 2Gi  # Memory limit per pod (max allowed)

# RERANKER - Re-orders search results by relevance
# ServiceAccount: rag-reranker-model (auto-created, immutable)
# Metrics exposed at: /metrics on port 8202
reranker:
  enabled: true
  embedderImage: ghcr.io/athithya-sakthivel/reranker:2026-05-07-06-10--5e0b28b@sha256:60475c50371406a2f43ef9b5c2e5a0a32f9b953a02ecbe7f622ad9c1ddd92495
  namespace: inference
  modelName: "Xenova/ms-marco-MiniLM-L-6-v2"  # HuggingFace model: https://qdrant.github.io/fastembed/examples/Supported_Models/#supported-rerank-cross-encoder-models
  batchSize: 16  # Document pairs scored at once. Higher = faster, more memory
  gpuCount: 1  # Rerankers benefit significantly from GPU
  replicas: 2  # Pod copies for HA. IGNORED if hpa.enabled is true
  hpa:
    enabled: false  # Auto-scale replicas based on CPU
    min: 1  # Minimum pods when idle
    max: 3  # Maximum pods under load
    targetCPU: 60  # Scale up when CPU exceeds 60%
    resources:
      requests:
        cpu: 500m  # CPU requested per pod (guaranteed)
        memory: 1Gi  # Memory requested per pod (guaranteed)
      limits:
        cpu: 2000m  # CPU limit per pod (burstable)
        memory: 2Gi  # Memory limit per pod (max allowed)

### PROMETHEUS SCRAPING CONFIGURATION
### Each service exposes these metrics at /metrics:
###   {service}_requests_total{model, cuda, status}  - Request count by outcome
###   {service}_request_duration_seconds{model, cuda} - Latency histogram
###   {service}_requests_in_progress{model, cuda}     - Active requests gauge
###   {service}_errors_total{model, cuda, error_type} - Errors by type
###
### PORT, /metrics, serviceaccount names are fixed but namespace may vary.
scrape_configs:
  - job_name: 'fastembed'
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets:
        - 'rag-dense-model.inference:8200'
        - 'rag-sparse-model.inference:8201'
        - 'rag-reranker-model.inference:8202'
    metric_relabel_configs:
      # Keep all metrics from these services
      - source_labels: [__name__]
        regex: '(dense|sparse|reranker)_.*'
        action: keep