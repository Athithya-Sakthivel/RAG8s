{{- if .Values.reranker.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "fastembed.roleBindingName" (dict "service" "reranker") }}
  namespace: {{ .Values.reranker.namespace }}
  labels:
    {{- include "fastembed.labels" (dict "Chart" .Chart "Release" .Release "name" "reranker" "component" "reranker" "instance" "reranker") | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: {{ include "fastembed.serviceAccountName" (dict "service" "reranker") }}
  namespace: {{ .Values.reranker.namespace }}
roleRef:
  kind: Role
  name: {{ include "fastembed.roleName" (dict "service" "reranker") }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}