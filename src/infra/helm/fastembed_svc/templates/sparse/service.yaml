{{- if .Values.sparse.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fastembed.serviceName" (dict "service" "sparse") }}
  namespace: {{ .Values.sparse.namespace }}
  labels:
    {{- include "fastembed.labels" (dict "Chart" .Chart "Release" .Release "name" "sparse" "component" "embedder" "instance" "sparse") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
  - port: 8201
    targetPort: 8201
    protocol: TCP
    name: http
  selector:
    {{- include "fastembed.selectorLabels" (dict "name" "sparse" "component" "embedder" "instance" "sparse") | nindent 4 }}
{{- end }}