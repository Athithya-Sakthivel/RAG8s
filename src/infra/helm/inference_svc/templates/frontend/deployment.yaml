{{- if .Values.frontend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "inference-services.selectorLabels" (dict "component" "frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "inference-services.selectorLabels" (dict "component" "frontend") | nindent 8 }}
        {{- include "inference-services.commonLabels" . | nindent 8 }}
        app.kubernetes.io/part-of: frontend
    spec:
      serviceAccountName: {{ .Values.frontend.serviceAccount.name }}
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 1000
      {{- with .Values.frontend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.frontend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: static-files
          emptyDir: {}
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image }}"
          imagePullPolicy: {{ .Values.frontend.imagePullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SERVICE_NAME
              value: frontend
            {{- range $k, $v := .Values.frontend.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- if .Values.frontend.secrets }}
          envFrom:
            {{- range .Values.frontend.secrets }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: tmp
              mountPath: /var/tmp
            - name: static-files
              mountPath: /app/static
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          {{- if .Values.frontend.probes }}
          startupProbe:
            httpGet:
              path: {{ .Values.frontend.probes.startup.path | default "/health" }}
              port: 8000
              scheme: HTTP
            initialDelaySeconds: {{ .Values.frontend.probes.startup.initialDelaySeconds | default 5 }}
            timeoutSeconds: 5
            periodSeconds: {{ .Values.frontend.probes.startup.periodSeconds | default 5 }}
            failureThreshold: {{ .Values.frontend.probes.startup.failureThreshold | default 12 }}
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: {{ .Values.frontend.probes.liveness.path | default "/health" }}
              port: 8000
              scheme: HTTP
            initialDelaySeconds: 0
            timeoutSeconds: 5
            periodSeconds: {{ .Values.frontend.probes.liveness.periodSeconds | default 10 }}
            failureThreshold: {{ .Values.frontend.probes.liveness.failureThreshold | default 3 }}
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: {{ .Values.frontend.probes.readiness.path | default "/orchestrator/health" }}
              port: 8000
              scheme: HTTP
            initialDelaySeconds: 0
            timeoutSeconds: 5
            periodSeconds: {{ .Values.frontend.probes.readiness.periodSeconds | default 5 }}
            failureThreshold: {{ .Values.frontend.probes.readiness.failureThreshold | default 2 }}
            successThreshold: 1
          {{- end }}
{{- end }}