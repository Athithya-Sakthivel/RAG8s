{{- if .Values.cloudflared.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: cloudflared
    app.kubernetes.io/component: tunnel-config
    {{- include "inference-services.commonLabels" . | nindent 4 }}
data:
  config.yaml: |
    tunnel: {{ .Values.cloudflared.tunnel.name }}
    ingress:
    {{- range .Values.cloudflared.ingress.rules }}
    - hostname: {{ .hostname }}
      {{- if .path }}
      path: {{ .path }}
      {{- end }}
      service: {{ .service }}
      {{- if .originRequest }}
      originRequest:
        {{- toYaml .originRequest | nindent 8 }}
      {{- end }}
    {{- end }}
    - service: {{ .Values.cloudflared.ingress.catchAll }}
{{- end }}