apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authentik
  namespace: argocd
  labels:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/managed-by: argocd
  annotations:
    description: Authentik Helm deployment for Google federation and forward auth
spec:
  project: default
  source:
    repoURL: https://charts.goauthentik.io
    chart: authentik
    targetRevision: 2026.2.2
    helm:
      values: |
        global:
          envFrom:
          - secretRef:
              name: authentik-env
          env:
          - name: AUTHENTIK_HOST
            value: https://auth.athithya.site
          - name: AUTHENTIK_HOST_BROWSER
            value: https://auth.athithya.site
          - name: AUTHENTIK_EXTERNAL_URL
            value: https://auth.athithya.site
          - name: AUTHENTIK_COOKIE_DOMAIN
            value: .athithya.site
          - name: AUTHENTIK_POSTGRESQL__HOST
            value: authentik-postgresql
          - name: AUTHENTIK_POSTGRESQL__PORT
            value: '5432'
          - name: AUTHENTIK_POSTGRESQL__USER
            value: authentik
          - name: AUTHENTIK_POSTGRESQL__NAME
            value: authentik
          podAnnotations:
            authentik.argoproj.io/config-checksum: 99574045eb783dc507008e0484384518982ee338d3aefdf92703fd31d442d361
        authentik:
          enabled: true
          secret_key: env://AUTHENTIK_SECRET_KEY
          error_reporting:
            enabled: false
          log_level: info
          web:
            path: /
          postgresql:
            host: authentik-postgresql
            name: authentik
            user: authentik
            port: 5432
            password: env://AUTHENTIK_POSTGRESQL__PASSWORD
        server:
          enabled: true
          ingress:
            enabled: false
        worker:
          enabled: true
        blueprints:
          secrets:
          - name: authentik-blueprints
        postgresql:
          enabled: true
          auth:
            username: authentik
            database: authentik
            existingSecret: authentik-postgresql-auth
            secretKeys:
              adminPasswordKey: postgres-password
              userPasswordKey: password
  destination:
    server: https://kubernetes.default.svc
    namespace: authentik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - PrunePropagationPolicy=foreground
    - PruneLast=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
