apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: inference-applicationset
  namespace: argocd

spec:
  generators:
    - git:
        repoURL: https://github.com/Athithya-Sakthivel/E2E-RAG-System.git
        revision: main
        directories:
          - path: src/manifests/dense-service
          - path: src/manifests/reranker-service
          - path: src/manifests/retriever
          - path: src/manifests/sparse-service

  template:
    metadata:
      name: '{{path.basename}}'

    spec:
      project: default

      source:
        repoURL: https://github.com/Athithya-Sakthivel/E2E-RAG-System.git
        targetRevision: main
        path: '{{path}}'

      destination:
        server: https://kubernetes.default.svc
        namespace: inference   # fixed, no templating

      syncPolicy:
        automated:
          prune: true
          selfHeal: true

        syncOptions:
          - CreateNamespace=true
          - PrunePropagationPolicy=foreground
          - PruneLast=true