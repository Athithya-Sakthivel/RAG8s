# src/argocd/grafana-application.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: grafana
    targetRevision: 10.5.15   # <-- fix this line
    helm:
      values: |
        admin:
          existingSecret: grafana-admin

        service:
          type: ClusterIP
          port: 80

        persistence:
          enabled: false

        # ── Sidecar: discover dashboards & datasources from ConfigMaps ──
        sidecar:
          dashboards:
            enabled: true
            searchNamespace: grafana
            label: grafana_dashboard
          datasources:
            enabled: true
            searchNamespace: grafana
            label: grafana_datasource

        # ── Enable self‑metrics ──
        env:
          GF_METRICS_ENABLED: "true"
          GF_SERVER_PROTOCOL: http

  destination:
    server: https://kubernetes.default.svc
    namespace: grafana

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m

  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /spec/versions
    - group: ""
      kind: ConfigMap
      jsonPointers:
        - /data