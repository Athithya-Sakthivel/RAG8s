apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana-community.github.io/helm-charts
    chart: grafana
    targetRevision: 12.3.0
    helm:
      values: |
        # ── Admin credentials (existing secret) ──
        admin:
          existingSecret: grafana-admin

        # ── Service ──
        service:
          type: ClusterIP
          port: 80

        # ── Persistence (optional, disabled here for simplicity) ──
        persistence:
          enabled: false

        # ── Sidecar for dashboards & datasources ──
        sidecar:
          dashboards:
            enabled: true
            searchNamespace: grafana
            label: grafana_dashboard
          datasources:
            enabled: true
            searchNamespace: grafana
            label: grafana_datasource

        # ── Enable Grafana's own Prometheus metrics ──
        env:
          GF_METRICS_ENABLED: "true"
          GF_SERVER_PROTOCOL: http

        # ── Kubernetes resources created by Helm (extraDeploy) ──
        extraDeploy:
          # ── Dashboard: Observability Health ──
          - apiVersion: v1
            kind: ConfigMap
            metadata:
              name: grafana-dashboard-observability-health
              namespace: grafana
              labels:
                grafana_dashboard: "1"
            data:
              observability-health.json: |
                {
                  "uid": "observability-health",
                  "title": "Observability Health",
                  "tags": ["observability", "prometheus"],
                  "timezone": "browser",
                  "schemaVersion": 39,
                  "version": 4,
                  "refresh": "30s",
                  "editable": true,
                  "panels": [
                    {
                      "type": "stat",
                      "title": "Prometheus",
                      "gridPos": {"x": 0, "y": 0, "w": 6, "h": 6},
                      "datasource": {"type": "prometheus", "uid": "prometheus"},
                      "targets": [{"refId": "A", "expr": "min(up{job=\"prometheus\"})"}],
                      "fieldConfig": {
                        "defaults": {
                          "mappings": [
                            {"type": "value", "value": "1", "text": "UP"},
                            {"type": "value", "value": "0", "text": "DOWN"}
                          ],
                          "thresholds": {
                            "mode": "absolute",
                            "steps": [
                              {"color": "red", "value": null},
                              {"color": "red", "value": 0},
                              {"color": "green", "value": 1}
                            ]
                          },
                          "color": {"mode": "thresholds"},
                          "noValue": "DOWN"
                        }
                      },
                      "options": {"reduceOptions": {"values": false, "calcs": ["lastNotNull"]}, "textMode": "auto"}
                    },
                    {
                      "type": "stat",
                      "title": "Alertmanager",
                      "gridPos": {"x": 6, "y": 0, "w": 6, "h": 6},
                      "datasource": {"type": "prometheus", "uid": "prometheus"},
                      "targets": [{"refId": "A", "expr": "min(up{job=\"alertmanager\"})"}],
                      "fieldConfig": {
                        "defaults": {
                          "mappings": [
                            {"type": "value", "value": "1", "text": "UP"},
                            {"type": "value", "value": "0", "text": "DOWN"}
                          ],
                          "thresholds": {
                            "mode": "absolute",
                            "steps": [
                              {"color": "red", "value": null},
                              {"color": "red", "value": 0},
                              {"color": "green", "value": 1}
                            ]
                          },
                          "color": {"mode": "thresholds"},
                          "noValue": "DOWN"
                        }
                      },
                      "options": {"reduceOptions": {"values": false, "calcs": ["lastNotNull"]}, "textMode": "auto"}
                    },
                    {
                      "type": "stat",
                      "title": "ClickHouse",
                      "gridPos": {"x": 12, "y": 0, "w": 6, "h": 6},
                      "datasource": {"type": "prometheus", "uid": "prometheus"},
                      "targets": [{"refId": "A", "expr": "min(up{job=\"clickhouse\"})"}],
                      "fieldConfig": {
                        "defaults": {
                          "mappings": [
                            {"type": "value", "value": "1", "text": "UP"},
                            {"type": "value", "value": "0", "text": "DOWN"}
                          ],
                          "thresholds": {
                            "mode": "absolute",
                            "steps": [
                              {"color": "red", "value": null},
                              {"color": "red", "value": 0},
                              {"color": "green", "value": 1}
                            ]
                          },
                          "color": {"mode": "thresholds"},
                          "noValue": "DOWN"
                        }
                      },
                      "options": {"reduceOptions": {"values": false, "calcs": ["lastNotNull"]}, "textMode": "auto"}
                    },
                    {
                      "type": "stat",
                      "title": "Vector",
                      "gridPos": {"x": 18, "y": 0, "w": 6, "h": 6},
                      "datasource": {"type": "prometheus", "uid": "prometheus"},
                      "targets": [{"refId": "A", "expr": "min(up{job=\"vector\"})"}],
                      "fieldConfig": {
                        "defaults": {
                          "mappings": [
                            {"type": "value", "value": "1", "text": "UP"},
                            {"type": "value", "value": "0", "text": "DOWN"}
                          ],
                          "thresholds": {
                            "mode": "absolute",
                            "steps": [
                              {"color": "red", "value": null},
                              {"color": "red", "value": 0},
                              {"color": "green", "value": 1}
                            ]
                          },
                          "color": {"mode": "thresholds"},
                          "noValue": "DOWN"
                        }
                      },
                      "options": {"reduceOptions": {"values": false, "calcs": ["lastNotNull"]}, "textMode": "auto"}
                    },
                    {
                      "type": "stat",
                      "title": "Active Alerts",
                      "gridPos": {"x": 0, "y": 6, "w": 6, "h": 6},
                      "datasource": {"type": "prometheus", "uid": "prometheus"},
                      "targets": [{"refId": "A", "expr": "sum(ALERTS{alertstate=\"firing\"})"}],
                      "fieldConfig": {
                        "defaults": {
                          "mappings": [
                            {"type": "value", "value": "0", "text": "None"},
                            {"type": "range", "from": "1", "to": "999", "text": "FIRING"}
                          ],
                          "thresholds": {
                            "mode": "absolute",
                            "steps": [
                              {"color": "green", "value": null},
                              {"color": "red", "value": 1}
                            ]
                          },
                          "color": {"mode": "thresholds"},
                          "noValue": "None"
                        }
                      },
                      "options": {"reduceOptions": {"values": false, "calcs": ["lastNotNull"]}, "textMode": "auto"}
                    },
                    {
                      "type": "stat",
                      "title": "Prometheus Storage",
                      "gridPos": {"x": 6, "y": 6, "w": 6, "h": 6},
                      "datasource": {"type": "prometheus", "uid": "prometheus"},
                      "targets": [{"refId": "A", "expr": "max(prometheus_tsdb_storage_blocks_bytes)"}],
                      "fieldConfig": {
                        "defaults": {
                          "unit": "bytes",
                          "decimals": 2,
                          "thresholds": {
                            "mode": "absolute",
                            "steps": [
                              {"color": "green", "value": null},
                              {"color": "yellow", "value": 40000000000},
                              {"color": "red", "value": 50000000000}
                            ]
                          },
                          "color": {"mode": "thresholds"}
                        }
                      },
                      "options": {"reduceOptions": {"values": false, "calcs": ["lastNotNull"]}, "textMode": "auto"}
                    },
                    {
                      "type": "stat",
                      "title": "ClickHouse Read-Only",
                      "gridPos": {"x": 12, "y": 6, "w": 6, "h": 6},
                      "datasource": {"type": "prometheus", "uid": "prometheus"},
                      "targets": [{"refId": "A", "expr": "max(clickhouse_is_readonly{job=\"clickhouse\"})"}],
                      "fieldConfig": {
                        "defaults": {
                          "mappings": [
                            {"type": "value", "value": "0", "text": "Writable"},
                            {"type": "value", "value": "1", "text": "READONLY"}
                          ],
                          "thresholds": {
                            "mode": "absolute",
                            "steps": [
                              {"color": "green", "value": null},
                              {"color": "red", "value": 1}
                            ]
                          },
                          "color": {"mode": "thresholds"},
                          "noValue": "—"
                        }
                      },
                      "options": {"reduceOptions": {"values": false, "calcs": ["lastNotNull"]}, "textMode": "auto"}
                    },
                    {
                      "type": "stat",
                      "title": "Vector Buffer Events",
                      "gridPos": {"x": 18, "y": 6, "w": 6, "h": 6},
                      "datasource": {"type": "prometheus", "uid": "prometheus"},
                      "targets": [{"refId": "A", "expr": "sum(vector_component_buffer_events{job=\"vector\"})"}],
                      "fieldConfig": {
                        "defaults": {
                          "thresholds": {
                            "mode": "absolute",
                            "steps": [
                              {"color": "green", "value": null},
                              {"color": "yellow", "value": 500},
                              {"color": "red", "value": 1000}
                            ]
                          },
                          "color": {"mode": "thresholds"},
                          "noValue": "—"
                        }
                      },
                      "options": {"reduceOptions": {"values": false, "calcs": ["lastNotNull"]}, "textMode": "auto"}
                    },
                    {
                      "type": "timeseries",
                      "title": "ClickHouse Insert Rate",
                      "gridPos": {"x": 0, "y": 12, "w": 6, "h": 6},
                      "datasource": {"type": "prometheus", "uid": "prometheus"},
                      "targets": [{"refId": "A", "expr": "sum(rate(clickhouse_inserts_per_query{job=\"clickhouse\"}[5m]))", "legendFormat": "inserts/s"}],
                      "fieldConfig": {
                        "defaults": {
                          "unit": "short",
                          "thresholds": {
                            "mode": "absolute",
                            "steps": [
                              {"color": "red", "value": null},
                              {"color": "green", "value": 0.01}
                            ]
                          },
                          "color": {"mode": "thresholds"},
                          "custom": {"lineWidth": 2, "fillOpacity": 10, "spanNulls": true}
                        }
                      },
                      "options": {"legend": {"displayMode": "list", "placement": "bottom"}}
                    },
                    {
                      "type": "timeseries",
                      "title": "ClickHouse Memory Tracking",
                      "gridPos": {"x": 6, "y": 12, "w": 6, "h": 6},
                      "datasource": {"type": "prometheus", "uid": "prometheus"},
                      "targets": [{"refId": "A", "expr": "sum(clickhouse_memory_tracking{job=\"clickhouse\"})", "legendFormat": "total memory"}],
                      "fieldConfig": {
                        "defaults": {
                          "unit": "bytes",
                          "thresholds": {
                            "mode": "absolute",
                            "steps": [
                              {"color": "green", "value": null},
                              {"color": "yellow", "value": 12884901888},
                              {"color": "red", "value": 17179869184}
                            ]
                          },
                          "color": {"mode": "thresholds"},
                          "custom": {"lineWidth": 2, "fillOpacity": 10, "spanNulls": true}
                        }
                      },
                      "options": {"legend": {"displayMode": "list", "placement": "bottom"}}
                    },
                    {
                      "type": "timeseries",
                      "title": "Vector Events In / Out",
                      "gridPos": {"x": 12, "y": 12, "w": 12, "h": 6},
                      "datasource": {"type": "prometheus", "uid": "prometheus"},
                      "targets": [
                        {"refId": "A", "expr": "sum(rate(vector_component_events_in_total{job=\"vector\"}[5m])) by (component_id)", "legendFormat": "in: {{component_id}}"},
                        {"refId": "B", "expr": "sum(rate(vector_component_events_out_total{job=\"vector\"}[5m])) by (component_id)", "legendFormat": "out: {{component_id}}"}
                      ],
                      "fieldConfig": {
                        "defaults": {
                          "unit": "short",
                          "custom": {"lineWidth": 2, "fillOpacity": 10, "spanNulls": true},
                          "color": {"mode": "palette-classic"}
                        }
                      },
                      "options": {"legend": {"displayMode": "table", "placement": "right"}}
                    }
                  ],
                  "time": {"from": "now-15m", "to": "now"}
                }

          # ── Dashboard: RAG Pipeline ──
          - apiVersion: v1
            kind: ConfigMap
            metadata:
              name: grafana-dashboard-rag-pipeline
              namespace: grafana
              labels:
                grafana_dashboard: "1"
            data:
              rag-pipeline.json: |
                {
                  "uid": "rag-pipeline",
                  "title": "RAG Pipeline",
                  "tags": ["rag", "pipeline", "prometheus"],
                  "timezone": "browser",
                  "schemaVersion": 39,
                  "version": 2,
                  "refresh": "30s",
                  "editable": true,
                  "panels": [
                    {
                      "type": "timeseries",
                      "title": "Pipeline Latency P95",
                      "gridPos": {"x": 0, "y": 0, "w": 6, "h": 8},
                      "datasource": {"type": "prometheus", "uid": "prometheus"},
                      "targets": [{"refId": "A", "expr": "histogram_quantile(0.95, rate(retrieval_pipeline_duration_seconds_bucket{job=\"retriever\"}[5m]))", "legendFormat": "P95"}],
                      "fieldConfig": {
                        "defaults": {
                          "unit": "s",
                          "thresholds": {
                            "mode": "absolute",
                            "steps": [
                              {"color": "green", "value": null},
                              {"color": "yellow", "value": 3},
                              {"color": "red", "value": 10}
                            ]
                          },
                          "color": {"mode": "thresholds"},
                          "custom": {"lineWidth": 2, "fillOpacity": 10, "spanNulls": true}
                        }
                      },
                      "options": {"legend": {"displayMode": "list", "placement": "bottom"}}
                    },
                    {
                      "type": "timeseries",
                      "title": "Pipeline Requests/sec",
                      "gridPos": {"x": 6, "y": 0, "w": 6, "h": 8},
                      "datasource": {"type": "prometheus", "uid": "prometheus"},
                      "targets": [{"refId": "A", "expr": "sum(rate(retrieval_pipeline_duration_seconds_count{job=\"retriever\"}[5m]))", "legendFormat": "requests/s"}],
                      "fieldConfig": {
                        "defaults": {
                          "unit": "reqps",
                          "thresholds": {"mode": "absolute", "steps": [{"color": "green"}]},
                          "color": {"mode": "thresholds"},
                          "custom": {"lineWidth": 2, "fillOpacity": 10, "spanNulls": true}
                        }
                      },
                      "options": {"legend": {"displayMode": "list", "placement": "bottom"}}
                    },
                    {
                      "type": "timeseries",
                      "title": "Qdrant Query Latency P95",
                      "gridPos": {"x": 12, "y": 0, "w": 6, "h": 8},
                      "datasource": {"type": "prometheus", "uid": "prometheus"},
                      "targets": [{"refId": "A", "expr": "histogram_quantile(0.95, rate(retrieval_qdrant_query_duration_seconds_bucket{job=\"retriever\"}[5m]))", "legendFormat": "P95"}],
                      "fieldConfig": {
                        "defaults": {
                          "unit": "s",
                          "thresholds": {
                            "mode": "absolute",
                            "steps": [
                              {"color": "green", "value": null},
                              {"color": "yellow", "value": 0.5},
                              {"color": "red", "value": 2}
                            ]
                          },
                          "color": {"mode": "thresholds"},
                          "custom": {"lineWidth": 2, "fillOpacity": 10, "spanNulls": true}
                        }
                      },
                      "options": {"legend": {"displayMode": "list", "placement": "bottom"}}
                    },
                    {
                      "type": "stat",
                      "title": "Cache Hit Ratio",
                      "gridPos": {"x": 18, "y": 0, "w": 6, "h": 8},
                      "datasource": {"type": "prometheus", "uid": "prometheus"},
                      "targets": [{"refId": "A", "expr": "sum(rate(retrieval_cache_lookup_total{job=\"retriever\",result=~\"exact_hit|semantic.*\"}[5m])) / sum(rate(retrieval_cache_lookup_total{job=\"retriever\"}[5m]))"}],
                      "fieldConfig": {
                        "defaults": {
                          "unit": "percentunit",
                          "decimals": 1,
                          "thresholds": {
                            "mode": "absolute",
                            "steps": [
                              {"color": "red", "value": null},
                              {"color": "yellow", "value": 0.3},
                              {"color": "green", "value": 0.6}
                            ]
                          },
                          "color": {"mode": "thresholds"},
                          "noValue": "—"
                        }
                      },
                      "options": {"reduceOptions": {"values": false, "calcs": ["lastNotNull"]}, "textMode": "auto"}
                    },
                    {
                      "type": "timeseries",
                      "title": "Embedding Requests/sec",
                      "gridPos": {"x": 0, "y": 8, "w": 6, "h": 8},
                      "datasource": {"type": "prometheus", "uid": "prometheus"},
                      "targets": [
                        {"refId": "A", "expr": "sum(rate(retrieval_dense_embed_requests_total{job=\"retriever\"}[5m]))", "legendFormat": "dense"},
                        {"refId": "B", "expr": "sum(rate(retrieval_sparse_embed_requests_total{job=\"retriever\"}[5m]))", "legendFormat": "sparse"}
                      ],
                      "fieldConfig": {
                        "defaults": {
                          "unit": "reqps",
                          "thresholds": {"mode": "absolute", "steps": [{"color": "green"}]},
                          "color": {"mode": "thresholds"},
                          "custom": {"lineWidth": 2, "fillOpacity": 10, "spanNulls": true}
                        }
                      },
                      "options": {"legend": {"displayMode": "list", "placement": "bottom"}}
                    },
                    {
                      "type": "timeseries",
                      "title": "Reranker Requests/sec",
                      "gridPos": {"x": 6, "y": 8, "w": 6, "h": 8},
                      "datasource": {"type": "prometheus", "uid": "prometheus"},
                      "targets": [{"refId": "A", "expr": "sum(rate(retrieval_rerank_requests_total{job=\"retriever\"}[5m]))", "legendFormat": "rerank/s"}],
                      "fieldConfig": {
                        "defaults": {
                          "unit": "reqps",
                          "thresholds": {"mode": "absolute", "steps": [{"color": "green"}]},
                          "color": {"mode": "thresholds"},
                          "custom": {"lineWidth": 2, "fillOpacity": 10, "spanNulls": true}
                        }
                      },
                      "options": {"legend": {"displayMode": "list", "placement": "bottom"}}
                    },
                    {
                      "type": "timeseries",
                      "title": "LLM Requests/sec & Latency P95",
                      "gridPos": {"x": 12, "y": 8, "w": 6, "h": 8},
                      "datasource": {"type": "prometheus", "uid": "prometheus"},
                      "targets": [
                        {"refId": "A", "expr": "sum(rate(retrieval_llm_requests_total{job=\"retriever\"}[5m]))", "legendFormat": "req/s"},
                        {"refId": "B", "expr": "histogram_quantile(0.95, rate(retrieval_llm_duration_seconds_bucket{job=\"retriever\"}[5m]))", "legendFormat": "P95 latency"}
                      ],
                      "fieldConfig": {
                        "defaults": {
                          "unit": "short",
                          "thresholds": {
                            "mode": "absolute",
                            "steps": [
                              {"color": "green", "value": null},
                              {"color": "yellow", "value": 5},
                              {"color": "red", "value": 15}
                            ]
                          },
                          "color": {"mode": "thresholds"},
                          "custom": {"lineWidth": 2, "fillOpacity": 10, "spanNulls": true}
                        }
                      },
                      "options": {"legend": {"displayMode": "list", "placement": "bottom"}}
                    },
                    {
                      "type": "timeseries",
                      "title": "Circuit Breakers / Errors",
                      "gridPos": {"x": 18, "y": 8, "w": 6, "h": 8},
                      "datasource": {"type": "prometheus", "uid": "prometheus"},
                      "targets": [
                        {"refId": "A", "expr": "sum(rate(retrieval_circuit_breaker_open_total{job=\"retriever\"}[5m])) by (dependency)", "legendFormat": "breaker: {{dependency}}"},
                        {"refId": "B", "expr": "sum(rate(retrieval_dependency_errors_total{job=\"retriever\"}[5m])) by (dependency)", "legendFormat": "err: {{dependency}}"}
                      ],
                      "fieldConfig": {
                        "defaults": {
                          "unit": "short",
                          "thresholds": {
                            "mode": "absolute",
                            "steps": [
                              {"color": "green", "value": null},
                              {"color": "red", "value": 0}
                            ]
                          },
                          "color": {"mode": "thresholds"},
                          "custom": {"lineWidth": 2, "fillOpacity": 10, "spanNulls": true}
                        }
                      },
                      "options": {"legend": {"displayMode": "list", "placement": "bottom"}}
                    }
                  ],
                  "time": {"from": "now-15m", "to": "now"}
                }

          # ── Dashboard: Frontend & Auth ──
          - apiVersion: v1
            kind: ConfigMap
            metadata:
              name: grafana-dashboard-frontend-auth
              namespace: grafana
              labels:
                grafana_dashboard: "1"
            data:
              frontend-auth.json: |
                {
                  "uid": "frontend-auth",
                  "title": "Frontend & Auth",
                  "tags": ["frontend", "auth", "prometheus"],
                  "timezone": "browser",
                  "schemaVersion": 39,
                  "version": 2,
                  "refresh": "30s",
                  "editable": true,
                  "panels": [
                    {
                      "type": "timeseries",
                      "title": "Request Rate by Route",
                      "gridPos": {"x": 0, "y": 0, "w": 8, "h": 8},
                      "datasource": {"type": "prometheus", "uid": "prometheus"},
                      "targets": [{"refId": "A", "expr": "sum(rate(frontend_requests_total{job=\"frontend-auth\"}[5m])) by (route)", "legendFormat": "{{route}}"}],
                      "fieldConfig": {
                        "defaults": {
                          "unit": "reqps",
                          "custom": {"lineWidth": 2, "fillOpacity": 10, "spanNulls": true},
                          "color": {"mode": "palette-classic"}
                        }
                      },
                      "options": {"legend": {"displayMode": "table", "placement": "right"}}
                    },
                    {
                      "type": "timeseries",
                      "title": "Latency P95 by Route",
                      "gridPos": {"x": 8, "y": 0, "w": 8, "h": 8},
                      "datasource": {"type": "prometheus", "uid": "prometheus"},
                      "targets": [{"refId": "A", "expr": "histogram_quantile(0.95, rate(frontend_request_latency_seconds_bucket{job=\"frontend-auth\"}[5m]))", "legendFormat": "{{route}}"}],
                      "fieldConfig": {
                        "defaults": {
                          "unit": "s",
                          "thresholds": {
                            "mode": "absolute",
                            "steps": [
                              {"color": "green", "value": null},
                              {"color": "yellow", "value": 0.5},
                              {"color": "red", "value": 2}
                            ]
                          },
                          "color": {"mode": "thresholds"},
                          "custom": {"lineWidth": 2, "fillOpacity": 10, "spanNulls": true}
                        }
                      },
                      "options": {"legend": {"displayMode": "table", "placement": "right"}}
                    },
                    {
                      "type": "timeseries",
                      "title": "Stream Error Rate",
                      "gridPos": {"x": 16, "y": 0, "w": 8, "h": 8},
                      "datasource": {"type": "prometheus", "uid": "prometheus"},
                      "targets": [{"refId": "A", "expr": "sum(rate(frontend_upstream_stream_errors_total{job=\"frontend-auth\"}[5m])) / sum(rate(frontend_requests_total{job=\"frontend-auth\",route=\"/generate/stream\"}[5m]))", "legendFormat": "error ratio"}],
                      "fieldConfig": {
                        "defaults": {
                          "unit": "percentunit",
                          "thresholds": {
                            "mode": "absolute",
                            "steps": [
                              {"color": "green", "value": null},
                              {"color": "yellow", "value": 0.02},
                              {"color": "red", "value": 0.05}
                            ]
                          },
                          "color": {"mode": "thresholds"},
                          "custom": {"lineWidth": 2, "fillOpacity": 15, "spanNulls": true}
                        }
                      },
                      "options": {"legend": {"displayMode": "list", "placement": "bottom"}}
                    },
                    {
                      "type": "timeseries",
                      "title": "Auth Events",
                      "gridPos": {"x": 0, "y": 8, "w": 12, "h": 8},
                      "datasource": {"type": "prometheus", "uid": "prometheus"},
                      "targets": [{"refId": "A", "expr": "sum(rate(frontend_auth_events_total{job=\"frontend-auth\"}[5m])) by (event, provider, outcome)", "legendFormat": "{{event}} ({{provider}}) {{outcome}}"}],
                      "fieldConfig": {
                        "defaults": {
                          "unit": "short",
                          "custom": {"lineWidth": 2, "fillOpacity": 10, "spanNulls": true},
                          "color": {"mode": "palette-classic"}
                        }
                      },
                      "options": {"legend": {"displayMode": "table", "placement": "right"}}
                    },
                    {
                      "type": "timeseries",
                      "title": "Rate Limit Hits",
                      "gridPos": {"x": 12, "y": 8, "w": 12, "h": 8},
                      "datasource": {"type": "prometheus", "uid": "prometheus"},
                      "targets": [{"refId": "A", "expr": "sum(rate(frontend_rate_limit_events_total{job=\"frontend-auth\",outcome=\"limited\"}[5m]))", "legendFormat": "rate limited"}],
                      "fieldConfig": {
                        "defaults": {
                          "unit": "short",
                          "thresholds": {
                            "mode": "absolute",
                            "steps": [
                              {"color": "green", "value": null},
                              {"color": "yellow", "value": 0.05},
                              {"color": "red", "value": 0.2}
                            ]
                          },
                          "color": {"mode": "thresholds"},
                          "custom": {"lineWidth": 2, "fillOpacity": 15, "spanNulls": true}
                        }
                      },
                      "options": {"legend": {"displayMode": "list", "placement": "bottom"}}
                    },
                    {
                      "type": "timeseries",
                      "title": "JWKS Requests",
                      "gridPos": {"x": 0, "y": 16, "w": 6, "h": 6},
                      "datasource": {"type": "prometheus", "uid": "prometheus"},
                      "targets": [{"refId": "A", "expr": "sum(rate(frontend_jwks_requests_total{job=\"frontend-auth\"}[5m]))", "legendFormat": "jwks/s"}],
                      "fieldConfig": {
                        "defaults": {
                          "unit": "reqps",
                          "custom": {"lineWidth": 2, "fillOpacity": 10, "spanNulls": true},
                          "color": {"mode": "palette-classic"}
                        }
                      },
                      "options": {"legend": {"displayMode": "list", "placement": "bottom"}}
                    },
                    {
                      "type": "stat",
                      "title": "Active Streams",
                      "gridPos": {"x": 6, "y": 16, "w": 6, "h": 6},
                      "datasource": {"type": "prometheus", "uid": "prometheus"},
                      "targets": [{"refId": "A", "expr": "sum(frontend_active_requests{job=\"frontend-auth\",route=\"/generate/stream\"})"}],
                      "fieldConfig": {
                        "defaults": {
                          "thresholds": {"mode": "absolute", "steps": [{"color": "green"}]},
                          "color": {"mode": "thresholds"},
                          "noValue": "0"
                        }
                      },
                      "options": {"reduceOptions": {"values": false, "calcs": ["lastNotNull"]}, "textMode": "auto"}
                    },
                    {
                      "type": "stat",
                      "title": "Frontend Health",
                      "gridPos": {"x": 12, "y": 16, "w": 6, "h": 6},
                      "datasource": {"type": "prometheus", "uid": "prometheus"},
                      "targets": [{"refId": "A", "expr": "min(up{job=\"frontend-auth\"})"}],
                      "fieldConfig": {
                        "defaults": {
                          "mappings": [
                            {"type": "value", "value": "1", "text": "UP"},
                            {"type": "value", "value": "0", "text": "DOWN"}
                          ],
                          "thresholds": {
                            "mode": "absolute",
                            "steps": [
                              {"color": "red", "value": null},
                              {"color": "red", "value": 0},
                              {"color": "green", "value": 1}
                            ]
                          },
                          "color": {"mode": "thresholds"},
                          "noValue": "DOWN"
                        }
                      },
                      "options": {"reduceOptions": {"values": false, "calcs": ["lastNotNull"]}, "textMode": "auto"}
                    },
                    {
                      "type": "stat",
                      "title": "Auth Readiness",
                      "gridPos": {"x": 18, "y": 16, "w": 6, "h": 6},
                      "datasource": {"type": "prometheus", "uid": "prometheus"},
                      "targets": [{"refId": "A", "expr": "min(frontend_service_ready{job=\"frontend-auth\"})"}],
                      "fieldConfig": {
                        "defaults": {
                          "mappings": [
                            {"type": "value", "value": "1", "text": "Ready"},
                            {"type": "value", "value": "0", "text": "Not Ready"}
                          ],
                          "thresholds": {
                            "mode": "absolute",
                            "steps": [
                              {"color": "red", "value": null},
                              {"color": "red", "value": 0},
                              {"color": "green", "value": 1}
                            ]
                          },
                          "color": {"mode": "thresholds"},
                          "noValue": "Unknown"
                        }
                      },
                      "options": {"reduceOptions": {"values": false, "calcs": ["lastNotNull"]}, "textMode": "auto"}
                    }
                  ],
                  "time": {"from": "now-15m", "to": "now"}
                }

          # ── Dashboard: Infrastructure & Network ──
          - apiVersion: v1
            kind: ConfigMap
            metadata:
              name: grafana-dashboard-infrastructure-network
              namespace: grafana
              labels:
                grafana_dashboard: "1"
            data:
              infrastructure-network.json: |
                {
                  "uid": "infrastructure-network",
                  "title": "Infrastructure & Network",
                  "tags": ["infrastructure", "network", "prometheus"],
                  "timezone": "browser",
                  "schemaVersion": 39,
                  "version": 2,
                  "refresh": "30s",
                  "editable": true,
                  "templating": {
                    "list": [
                      {
                        "name": "namespace",
                        "type": "query",
                        "query": "label_values(container_cpu_usage_seconds_total, namespace)",
                        "refresh": 1,
                        "includeAll": false,
                        "multi": false,
                        "current": {"text": "inference", "value": "inference"}
                      }
                    ]
                  },
                  "panels": [
                    {
                      "type": "timeseries",
                      "title": "Pod CPU Usage",
                      "gridPos": {"x": 0, "y": 0, "w": 12, "h": 8},
                      "datasource": {"type": "prometheus", "uid": "prometheus"},
                      "targets": [{"refId": "A", "expr": "rate(container_cpu_usage_seconds_total{namespace=\"$namespace\", container!=\"\"}[5m])", "legendFormat": "{{pod}}/{{container}}"}],
                      "fieldConfig": {
                        "defaults": {
                          "unit": "short",
                          "thresholds": {
                            "mode": "absolute",
                            "steps": [
                              {"color": "green", "value": null},
                              {"color": "yellow", "value": 0.8},
                              {"color": "red", "value": 1}
                            ]
                          },
                          "color": {"mode": "thresholds"},
                          "custom": {"lineWidth": 2, "fillOpacity": 10, "spanNulls": true}
                        }
                      },
                      "options": {"legend": {"displayMode": "table", "placement": "right"}}
                    },
                    {
                      "type": "timeseries",
                      "title": "Pod Memory (Working Set)",
                      "gridPos": {"x": 12, "y": 0, "w": 12, "h": 8},
                      "datasource": {"type": "prometheus", "uid": "prometheus"},
                      "targets": [{"refId": "A", "expr": "container_memory_working_set_bytes{namespace=\"$namespace\", container!=\"\"}", "legendFormat": "{{pod}}/{{container}}"}],
                      "fieldConfig": {
                        "defaults": {
                          "unit": "bytes",
                          "thresholds": {
                            "mode": "absolute",
                            "steps": [
                              {"color": "green", "value": null},
                              {"color": "yellow", "value": 8589934592},
                              {"color": "red", "value": 17179869184}
                            ]
                          },
                          "color": {"mode": "thresholds"},
                          "custom": {"lineWidth": 2, "fillOpacity": 10, "spanNulls": true}
                        }
                      },
                      "options": {"legend": {"displayMode": "table", "placement": "right"}}
                    },
                    {
                      "type": "timeseries",
                      "title": "Pod Network Receive",
                      "gridPos": {"x": 0, "y": 8, "w": 6, "h": 8},
                      "datasource": {"type": "prometheus", "uid": "prometheus"},
                      "targets": [{"refId": "A", "expr": "rate(container_network_receive_bytes_total{namespace=\"$namespace\", container!=\"\"}[5m])", "legendFormat": "{{pod}}"}],
                      "fieldConfig": {
                        "defaults": {
                          "unit": "Bps",
                          "color": {"mode": "palette-classic"},
                          "custom": {"lineWidth": 2, "fillOpacity": 10, "spanNulls": true}
                        }
                      },
                      "options": {"legend": {"displayMode": "list", "placement": "bottom"}}
                    },
                    {
                      "type": "timeseries",
                      "title": "Pod Network Transmit",
                      "gridPos": {"x": 6, "y": 8, "w": 6, "h": 8},
                      "datasource": {"type": "prometheus", "uid": "prometheus"},
                      "targets": [{"refId": "A", "expr": "rate(container_network_transmit_bytes_total{namespace=\"$namespace\", container!=\"\"}[5m])", "legendFormat": "{{pod}}"}],
                      "fieldConfig": {
                        "defaults": {
                          "unit": "Bps",
                          "color": {"mode": "palette-classic"},
                          "custom": {"lineWidth": 2, "fillOpacity": 10, "spanNulls": true}
                        }
                      },
                      "options": {"legend": {"displayMode": "list", "placement": "bottom"}}
                    },
                    {
                      "type": "timeseries",
                      "title": "Cloudflared Tunnel Errors",
                      "gridPos": {"x": 12, "y": 8, "w": 6, "h": 8},
                      "datasource": {"type": "prometheus", "uid": "prometheus"},
                      "targets": [{"refId": "A", "expr": "sum(rate(cloudflared_tunnel_request_errors{job=\"cloudflared\"}[5m]))", "legendFormat": "errors/s"}],
                      "fieldConfig": {
                        "defaults": {
                          "unit": "short",
                          "thresholds": {
                            "mode": "absolute",
                            "steps": [
                              {"color": "green", "value": null},
                              {"color": "red", "value": 0}
                            ]
                          },
                          "color": {"mode": "thresholds"},
                          "custom": {"lineWidth": 2, "fillOpacity": 15, "spanNulls": true}
                        }
                      },
                      "options": {"legend": {"displayMode": "list", "placement": "bottom"}}
                    },
                    {
                      "type": "stat",
                      "title": "Cloudflared Heartbeat Retries",
                      "gridPos": {"x": 18, "y": 8, "w": 6, "h": 4},
                      "datasource": {"type": "prometheus", "uid": "prometheus"},
                      "targets": [{"refId": "A", "expr": "max(cloudflared_tunnel_timer_retries{job=\"cloudflared\"})"}],
                      "fieldConfig": {
                        "defaults": {
                          "thresholds": {
                            "mode": "absolute",
                            "steps": [
                              {"color": "green", "value": null},
                              {"color": "yellow", "value": 3},
                              {"color": "red", "value": 5}
                            ]
                          },
                          "color": {"mode": "thresholds"},
                          "noValue": "—"
                        }
                      },
                      "options": {"reduceOptions": {"values": false, "calcs": ["lastNotNull"]}, "textMode": "auto"}
                    },
                    {
                      "type": "timeseries",
                      "title": "Cloudflared QUIC RTT",
                      "gridPos": {"x": 18, "y": 12, "w": 6, "h": 4},
                      "datasource": {"type": "prometheus", "uid": "prometheus"},
                      "targets": [
                        {"refId": "A", "expr": "quic_client_smoothed_rtt{job=\"cloudflared\"}", "legendFormat": "smoothed RTT"},
                        {"refId": "B", "expr": "quic_client_latest_rtt{job=\"cloudflared\"}", "legendFormat": "latest RTT"}
                      ],
                      "fieldConfig": {
                        "defaults": {
                          "unit": "s",
                          "thresholds": {
                            "mode": "absolute",
                            "steps": [
                              {"color": "green", "value": null},
                              {"color": "yellow", "value": 0.05},
                              {"color": "red", "value": 0.1}
                            ]
                          },
                          "color": {"mode": "thresholds"},
                          "custom": {"lineWidth": 2, "fillOpacity": 10, "spanNulls": true}
                        }
                      },
                      "options": {"legend": {"displayMode": "list", "placement": "bottom"}}
                    },
                    {
                      "type": "stat",
                      "title": "OOM Kills (Last 5m)",
                      "gridPos": {"x": 12, "y": 16, "w": 6, "h": 4},
                      "datasource": {"type": "prometheus", "uid": "prometheus"},
                      "targets": [{"refId": "A", "expr": "increase(container_oom_events_total{namespace=\"$namespace\", container!=\"\"}[5m])"}],
                      "fieldConfig": {
                        "defaults": {
                          "mappings": [
                            {"type": "value", "value": "0", "text": "None"},
                            {"type": "range", "from": "1", "to": "999", "text": "OOM!"}
                          ],
                          "thresholds": {
                            "mode": "absolute",
                            "steps": [
                              {"color": "green", "value": null},
                              {"color": "red", "value": 1}
                            ]
                          },
                          "color": {"mode": "thresholds"},
                          "noValue": "—"
                        }
                      },
                      "options": {"reduceOptions": {"values": false, "calcs": ["lastNotNull"]}, "textMode": "auto"}
                    },
                    {
                      "type": "stat",
                      "title": "Cloudflared Active Streams",
                      "gridPos": {"x": 18, "y": 16, "w": 6, "h": 4},
                      "datasource": {"type": "prometheus", "uid": "prometheus"},
                      "targets": [{"refId": "A", "expr": "sum(cloudflared_tunnel_active_streams{job=\"cloudflared\"})"}],
                      "fieldConfig": {
                        "defaults": {
                          "thresholds": {"mode": "absolute", "steps": [{"color": "green"}]},
                          "color": {"mode": "thresholds"},
                          "noValue": "—"
                        }
                      },
                      "options": {"reduceOptions": {"values": false, "calcs": ["lastNotNull"]}, "textMode": "auto"}
                    }
                  ],
                  "time": {"from": "now-15m", "to": "now"}
                }

          # ── Datasource ConfigMap ──
          - apiVersion: v1
            kind: ConfigMap
            metadata:
              name: grafana-datasource-prometheus
              namespace: grafana
              labels:
                grafana_datasource: "1"
            data:
              prometheus.yaml: |
                apiVersion: 1
                datasources:
                  - name: Prometheus
                    type: prometheus
                    uid: prometheus
                    access: proxy
                    url: http://prometheus-server.monitoring.svc.cluster.local:9090
                    isDefault: true
                    editable: false

  destination:
    server: https://kubernetes.default.svc
    namespace: grafana

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m

  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /spec/versions
    - group: ""
      kind: ConfigMap
      jsonPointers:
        - /data