apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
spec:
  project: default
  sources:
    # Source 1 – Grafana Helm chart (with sidecar enabled)
    - repoURL: https://grafana.github.io/helm-charts
      chart: grafana
      targetRevision: 10.5.15
      helm:
        values: |
          admin:
            existingSecret: grafana-admin

          service:
            type: ClusterIP
            port: 80

          persistence:
            enabled: false

          sidecar:
            dashboards:
              enabled: true
              searchNamespace: grafana
              label: grafana_dashboard
              labelValue: "1"
            datasources:
              enabled: true
              searchNamespace: grafana
              label: grafana_datasource
              labelValue: "1"

          env:
            GF_METRICS_ENABLED: "true"
            GF_SERVER_PROTOCOL: http

    # Source 2 – Dashboard & datasource ConfigMaps from Git
    - repoURL: https://github.com/Athithya-Sakthivel/E2E-RAG-System.git
      targetRevision: main
      path: src/manifests/grafana-dashboards
      directory:
        recurse: false

  destination:
    server: https://kubernetes.default.svc
    namespace: grafana

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true

  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /spec/versions
    - group: ""
      kind: ConfigMap
      jsonPointers:
        - /data