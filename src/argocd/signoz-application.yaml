apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: signoz
  namespace: argocd
  labels:
    app.kubernetes.io/name: signoz
    app.kubernetes.io/managed-by: argocd
  annotations:
    description: SigNoz Helm deployment (chart repo + external ClickHouse preserved)
    signoz.argoproj.io/environment: prod
spec:
  project: e2e-rag-system
  source:
    repoURL: https://charts.signoz.io
    chart: signoz
    targetRevision: 0.120.0
    helm:
      values: |
        global:
          clusterName: production-cluster
          clusterDomain: cluster.local
          configChecksum: 3ad138de68aaa18941254c6d42dd49cebbbe50da951fc5b4bb8a5574146fb518
        clickhouse:
          enabled: false
        externalClickhouse:
          host: my-clickhouse.default.svc.cluster.local
          user: admin
          existingSecret: signoz-clickhouse-auth
          existingSecretPasswordKey: password
        signoz:
          name: signoz
          replicaCount: 1
          env:
            signoz_telemetrystore_provider: clickhouse
            signoz_include_only_log_namespaces: inference
          podSecurityContext:
            fsGroup: 1000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          persistence:
            enabled: true
            storageClass: default-storage-class
            accessModes:
            - ReadWriteOnce
            size: 1Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: signoz
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - PrunePropagationPolicy=foreground
    - PruneLast=true
