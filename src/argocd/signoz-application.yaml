apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: signoz
  namespace: argocd
spec:
  project: e2e-rag-system
  source:
    repoURL: https://charts.signoz.io
    chart: signoz
    targetRevision: "0.120.0"
    helm:
      values: |
        clickhouse:
          enabled: false
        externalClickhouse:
          host: "clickhouse-clickhouse.clickhouse.svc.cluster.local:9000"
          user: "admin"
          existingSecret: "signoz-clickhouse-auth"
          existingSecretPasswordKey: password
        signoz:
          env:
            SIGNOZ_TOKENIZER_JWT_SECRET:
              valueFrom:
                secretKeyRef:
                  name: "signoz-jwt-secret"
                  key: SIGNOZ_TOKENIZER_JWT_SECRET
  destination:
    server: https://kubernetes.default.svc
    namespace: signoz
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: signoz-clickhouse-auth
      jsonPointers: ["/data"]
    - group: ""
      kind: Secret
      name: signoz-jwt-secret
      jsonPointers: ["/data"]
