apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: signoz
  namespace: argocd
  labels:
    app.kubernetes.io/name: signoz
    app.kubernetes.io/managed-by: argocd
  annotations:
    description: SigNoz Helm deployment (updated chart)
spec:
  project: e2e-rag-system
  source:
    repoURL: https://charts.signoz.io
    chart: signoz/signoz
    targetRevision: "0.120.0"
    helm:
      values: |
        global:
          clusterName: production-cluster
          clusterDomain: cluster.local
        clickhouse:
          enabled: false
        # If you have an external ClickHouse, set clickhouse.enabled: false and configure externalClickhouse below:
        # externalClickhouse:
        #   host: my-clickhouse.default.svc.cluster.local
        #   user: admin
        #   existingSecret: signoz-clickhouse-auth
        signoz:
          replicaCount: 1
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: signoz
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
  retry:
    limit: 3
    backoff:
      duration: 10s
      factor: 2
      maxDuration: 3m
