# values.yaml — prometheus-community/prometheus 29.6.0
# Final production‑ready RAG monitoring with Alertmanager
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

rbac:
  create: true

serviceAccounts:
  server:
    create: true
    name: ""

# ── Alertmanager enabled again ──────────────────────
alertmanager:
  enabled: true
  replicaCount: 1
  persistentVolume:
    enabled: false
  config:
    global:
      resolve_timeout: 5m
      slack_api_url: 'https://hooks.slack.com/services/xxx/yyy/zzz'
    route:
      receiver: 'default-receiver'
      group_by: ['alertname', 'namespace', 'severity']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        - receiver: 'pagerduty-critical'
          matchers:
            - severity = critical
          continue: true
        - receiver: 'slack-warnings'
          matchers:
            - severity = warning
    inhibit_rules:
      - source_matchers:
          - alertname = QdrantDown
        target_matchers:
          - alertname =~ "^(RetrieverHighPipelineLatency|RetrieverDependencyCircuitBreakerOpen|RetrieverHighCacheMissRate|QdrantRestFailureRate|QdrantHighMemoryResident|QdrantConsensusStalled)$"
      - source_matchers:
          - alertname = RetrieverDown
        target_matchers:
          - alertname =~ "^(RetrieverHighPipelineLatency|RetrieverDependencyCircuitBreakerOpen|RetrieverHighCacheMissRate|FrontendHighStreamErrorRate)$"
      - source_matchers:
          - alertname = FrontendDown
        target_matchers:
          - alertname =~ "^(FrontendHighStreamErrorRate|FrontendHighRateLimitHitRate)$"
    receivers:
      - name: 'default-receiver'
      - name: 'slack-warnings'
        slack_configs:
          - api_url: 'https://hooks.slack.com/services/T00/B00/XXX'
            channel: '#rag-alerts'
            username: 'RAG-Monitor'
            icon_emoji: ':warning:'
            send_resolved: true
            title: '{{ .Status | toUpper }}: {{ .CommonLabels.alertname }}'
            text: |-
              {{ range .Alerts }}
              *Severity:* {{ .Labels.severity }}
              *Summary:* {{ .Annotations.summary }}
              *Description:* {{ .Annotations.description }}
              {{ end }}
      - name: 'pagerduty-critical'
        pagerduty_configs:
          - routing_key: 'your-pagerduty-integration-key'
            severity: '{{ .CommonLabels.severity }}'
            description: '{{ .CommonAnnotations.summary }}'
            details:
              firing: '{{ template "__alertmanager_title" .Alerts.Firing }}'
              num_firing: '{{ .Alerts.Firing | len }}'
              num_resolved: '{{ .Alerts.Resolved | len }}'
    templates: []

# ── Disable unused dependencies ─────────────────────
kubeStateMetrics:
  enabled: false

nodeExporter:
  enabled: false

pushgateway:
  enabled: false

# ── Prometheus server ────────────────────────────────
server:
  statefulSet:
    enabled: true
    replicaCount: 1                     # start with 1, scale later

  persistentVolume:
    enabled: true
    storageClass: "default-storage-class"
    size: 50Gi
    mountPath: /data

  securityContext:
    runAsUser: 65534
    runAsNonRoot: true
    runAsGroup: 65534
    fsGroup: 65534

  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2
      memory: 4Gi

  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: prometheus
                app.kubernetes.io/component: server
            topologyKey: kubernetes.io/hostname

  strategy:
    type: Recreate

  service:
    enabled: true
    type: ClusterIP
    servicePort: 9090

  livenessProbe:
    httpGet:
      path: /-/healthy
      port: 9090
    initialDelaySeconds: 30
    periodSeconds: 20
  readinessProbe:
    httpGet:
      path: /-/ready
      port: 9090
    initialDelaySeconds: 15
    periodSeconds: 10

# ── Scrape Targets ───────────────────────────────────
extraScrapeConfigs: |
  - job_name: 'retriever'
    metrics_path: /metrics
    static_configs:
      - targets:
          - 'retriever.inference.svc.cluster.local:8001'

  - job_name: 'frontend-auth'
    metrics_path: /metrics
    static_configs:
      - targets:
          - 'frontend.inference.svc.cluster.local:8000'

  - job_name: 'cloudflared'
    scrape_interval: 30s
    static_configs:
      - targets:
          - 'cloudflared-metrics.inference.svc.cluster.local:2000'

  - job_name: 'cadvisor'
    scrape_interval: 30s
    honor_timestamps: true
    metrics_path: /metrics/cadvisor
    scheme: https
    tls_config:
      insecure_skip_verify: true
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels: [__meta_kubernetes_node_name]
        target_label: __metrics_path__
        replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
    metric_relabel_configs:
      - source_labels: [namespace]
        regex: '(inference|monitoring|qdrant|valkey)'
        action: keep

  - job_name: 'qdrant'
    scrape_interval: 30s
    metrics_path: /metrics
    static_configs:
      - targets:
          - 'qdrant-0.qdrant-headless.qdrant.svc.cluster.local:6333'
          - 'qdrant-1.qdrant-headless.qdrant.svc.cluster.local:6333'
          - 'qdrant-2.qdrant-headless.qdrant.svc.cluster.local:6333'

# ── Alert Rules (fixed template) ─────────────────────
serverFiles:
  alerts:
    groups:
      # ── Service Health ─────────────────────────
      - name: service_health
        rules:
          - alert: RetrieverDown
            expr: absent(up{job="retriever"}) or up{job="retriever"} == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Retriever service is down"
              description: "Retriever at retriever.inference.svc:8001 has been unreachable for 2 minutes."

          - alert: FrontendDown
            expr: absent(up{job="frontend-auth"}) or up{job="frontend-auth"} == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Frontend/Auth service is down"
              description: "Frontend at frontend.inference.svc:8000 has been unreachable for 2 minutes."

          - alert: QdrantDown
            expr: absent(up{job="qdrant"}) or up{job="qdrant"} == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Qdrant peer is down"
              description: "A Qdrant peer ({{ $labels.instance }}) has been unreachable for 2 minutes."

          - alert: CloudflaredDown
            expr: absent(up{job="cloudflared"}) or up{job="cloudflared"} == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Cloudflared tunnel is down"
              description: "The cloudflared metrics endpoint has been unreachable for 2 minutes."

      # ── Retriever Pipeline ──────────────────────
      - name: retriever_pipeline
        rules:
          - alert: RetrieverHighPipelineLatency
            expr: histogram_quantile(0.95, rate(retrieval_pipeline_duration_seconds_bucket[5m])) > 5
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Retriever P95 pipeline latency exceeds 5s"
              description: "P95 pipeline latency is {{ $value }}s."

          - alert: RetrieverHighCacheMissRate
            expr: (sum(rate(retrieval_cache_lookup_total{result="miss"}[5m])) / (sum(rate(retrieval_cache_lookup_total[5m])) + 1)) > 0.9
            for: 10m
            labels:
              severity: info
            annotations:
              summary: "Retriever cache miss rate above 90%"
              description: "Cache miss rate is {{ $value | humanizePercentage }}. Verify cache population if unexpected."

          - alert: RetrieverDependencyCircuitBreakerOpen
            expr: rate(retrieval_circuit_breaker_open_total[1m]) > 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Retriever circuit breaker opened for {{ $labels.dependency }}"
              description: "Circuit breaker for {{ $labels.dependency }} has opened. Check downstream service."

      # ── Frontend + Auth ──────────────────────────
      - name: frontend_auth
        rules:
          - alert: FrontendHighStreamErrorRate
            expr: rate(frontend_upstream_stream_errors_total[5m]) / (rate(frontend_requests_total{route="/generate/stream"}[5m]) + 1) > 0.05
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Frontend upstream stream error rate above 5%"
              description: "{{ $value | humanizePercentage }} of stream requests are failing."

          - alert: FrontendHighRateLimitHitRate
            expr: rate(frontend_rate_limit_events_total{outcome="limited"}[5m]) > 0.1
            for: 10m
            labels:
              severity: info
            annotations:
              summary: "Frontend rate limiting over 0.1 hits/s"
              description: "Rate limit hits at {{ $value }}/s. Users are being throttled."

      # ── Qdrant ──────────────────────────────────
      - name: qdrant
        rules:
          - alert: QdrantDeadReplicas
            expr: collection_dead_replicas > 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Qdrant has dead replica(s)"
              description: "{{ $value }} replica(s) are non‑active."

          - alert: QdrantRestFailureRate
            expr: rate(rest_responses_fail_total[5m]) / (rate(rest_responses_total[5m]) + 1) > 0.05
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Qdrant REST failure rate above 5%"
              description: "{{ $value | humanizePercentage }} of REST calls are failing."

          - alert: QdrantHighMemoryResident
            expr: memory_resident_bytes / (1024*1024*1024) > container_spec_memory_limit_bytes / (1024*1024*1024) * 0.85 or memory_resident_bytes / (1024*1024*1024) > 4
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Qdrant peer memory above 85% of limit"
              description: "Memory resident is {{ printf \"%.1f\" (query \"memory_resident_bytes / (1024*1024*1024)\") }} GiB."

          - alert: QdrantConsensusStalled
            expr: rate(cluster_commit[5m]) == 0 and cluster_enabled == 1
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Qdrant Raft consensus stalled"
              description: "No Raft commits in 5 minutes. Consensus may be broken."

      # ── Pod Resources (cAdvisor) ─────────────────
      - name: pod_resources
        rules:
          - alert: PodCPULimitNearSaturation
            expr: sum(rate(container_cpu_usage_seconds_total{namespace="inference", container!=""}[5m])) by (pod, container) / sum(container_spec_cpu_quota{namespace="inference", container!=""} / container_spec_cpu_period{namespace="inference", container!=""}) by (pod, container) > 0.9
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Pod {{ $labels.pod }}/{{ $labels.container }} CPU above 90% of limit"
              description: "CPU utilization is {{ $value | humanizePercentage }} of the limit. Throttling likely."

          - alert: PodHighMemoryUsage
            expr: container_memory_working_set_bytes{namespace="inference", container!=""} / container_spec_memory_limit_bytes{namespace="inference", container!=""} > 0.85
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Pod {{ $labels.pod }}/{{ $labels.container }} memory above 85% of limit"
              description: "Memory utilization is {{ $value | humanizePercentage }} of the limit. Possible OOM risk."

          - alert: PodOOMKilled
            expr: increase(container_oom_events_total{namespace="inference", container!=""}[5m]) > 0
            for: 0m
            labels:
              severity: critical
            annotations:
              summary: "Pod {{ $labels.pod }}/{{ $labels.container }} was OOM‑killed"
              description: "Container has been OOM‑killed in the last 5 minutes."

      # ── Cloudflared ─────────────────────────────
      - name: cloudflared
        rules:
          - alert: CloudflaredTunnelErrors
            expr: rate(cloudflared_tunnel_request_errors[5m]) > 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Cloudflared tunnel returning errors to origin"
              description: "Tunnel is returning errors ({{ $value }}/s). Users may see 5xx from Cloudflare."

          - alert: CloudflaredHighHeartbeatRetries
            expr: cloudflared_tunnel_timer_retries > 5
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Cloudflared tunnel has high heartbeat retries"
              description: "Heartbeat retries: {{ $value }}. Cloudflare edge connectivity may be unstable."