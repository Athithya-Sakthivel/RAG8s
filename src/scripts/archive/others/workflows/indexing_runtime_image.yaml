name: Runtime indexing image CI
on:
  push:
    branches: [main]
    paths:
      - src/indexing_pipeline/**
      - .github/workflows/indexing_runtime_image.yaml
  pull_request:
    paths:
      - src/indexing_pipeline/**

permissions:
  contents: read
  packages: write

concurrency:
  group: runtime-indexing-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GHCR_USER: athithya-sakthivel
  IMAGE_NAME: indexing-pipeline

jobs:
  build-push-runtime:
    name: Build and push runtime image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: staging

    env:
      GIT_PAT: ${{ secrets.GIT_PAT }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      - name: Compute image tags
        id: tags
        shell: bash
        run: |
          TIMESTAMP_TAG="$(TZ=Asia/Kolkata date +%Y-%m-%d-%H-%M)--$(git rev-parse --short HEAD)"
          IMAGE="ghcr.io/${GHCR_USER}/${IMAGE_NAME}"
          echo "image=${IMAGE}" >> $GITHUB_OUTPUT
          echo "timestamp_tag=${TIMESTAMP_TAG}" >> $GITHUB_OUTPUT
          echo "staging_tag=staging" >> $GITHUB_OUTPUT

      - name: Log in to GHCR (main branch only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ghcr.io
          username: ${{ env.GHCR_USER }}
          password: ${{ env.GIT_PAT }}

      - name: Build and push runtime image
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294
        with:
          context: src/indexing_pipeline
          file: src/indexing_pipeline/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          load: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
          pull: true
          tags: |
            ${{ steps.tags.outputs.image }}:${{ steps.tags.outputs.timestamp_tag }}
            ${{ steps.tags.outputs.image }}:${{ steps.tags.outputs.staging_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=min