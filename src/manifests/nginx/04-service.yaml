apiVersion: v1
kind: Service
metadata:
  name: frontend-nginx
  namespace: inference
  labels:
    app.kubernetes.io/name: frontend-nginx
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: frontend-nginx
    app.kubernetes.io/component: frontend
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: 8080
