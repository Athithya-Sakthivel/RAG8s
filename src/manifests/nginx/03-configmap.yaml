apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx-config
  namespace: inference
  labels:
    app.kubernetes.io/name: frontend-nginx
    app.kubernetes.io/component: frontend
data:
  nginx.conf: |-
    worker_processes auto;
    pid /tmp/nginx.pid;

    events {
        worker_connections 1024;
    }

    http {
        include       /etc/nginx/mime.types;
        default_type   application/octet-stream;

        sendfile        on;
        tcp_nopush     on;
        tcp_nodelay    on;
        keepalive_timeout 65;
        server_tokens   off;

        client_body_temp_path /tmp/client_body;
        proxy_temp_path       /tmp/proxy;
        fastcgi_temp_path     /tmp/fastcgi;
        uwsgi_temp_path       /tmp/uwsgi;
        scgi_temp_path        /tmp/scgi;

        gzip on;
        gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
        gzip_min_length 1024;

        # Kubernetes DNS. Change only if your cluster DNS IP differs.
        resolver 10.96.0.10 valid=10s ipv6=off;
        resolver_timeout 2s;

        map $http_upgrade $connection_upgrade {
            default upgrade;
            ''      '';
        }

        server {
            listen 8080;
            server_name athithya.site api.athithya.site;

            root /usr/share/nginx/html;
            index index.html;

            set $authentik_origin http://authentik-server.authentik.svc.cluster.local:80;
            set $retriever_origin http://retriever.inference.svc.cluster.local:8001;

            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "no-referrer-when-downgrade" always;

            location = /healthz {
                access_log off;
                add_header Cache-Control "no-store" always;
                return 200 'ok';
            }

            location = /readyz {
                access_log off;
                add_header Cache-Control "no-store" always;
                return 200 'ok';
            }

            location = /login {
                return 302 https://auth.athithya.site/outpost.goauthentik.io/start?rd=https://$http_host$request_uri;
            }

            location = /auth/login {
                return 302 https://auth.athithya.site/outpost.goauthentik.io/start?rd=https://$http_host$request_uri;
            }

            location = /logout {
                return 302 https://auth.athithya.site/outpost.goauthentik.io/sign_out;
            }

            location = /auth/logout {
                return 302 https://auth.athithya.site/outpost.goauthentik.io/sign_out;
            }

            # Authentik outpost endpoints must bypass auth_request.
            location ^~ /outpost.goauthentik.io/ {
                proxy_pass $authentik_origin;

                proxy_http_version 1.1;
                proxy_set_header Host auth.athithya.site;
                proxy_set_header X-Forwarded-Host $http_host;
                proxy_set_header X-Forwarded-Proto https;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Original-URL https://$http_host$request_uri;
                proxy_pass_request_body off;
                proxy_set_header Content-Length "";
                proxy_set_header Connection "";
                proxy_buffering off;
                proxy_request_buffering off;
            }

            location = /api {
                return 301 /api/;
            }

            location ^~ /api/ {
                auth_request /outpost.goauthentik.io/auth/nginx;
                error_page 401 403 = @goauthentik_proxy_signin;

                auth_request_set $auth_cookie $upstream_http_set_cookie;
                auth_request_set $authentik_username $upstream_http_x_authentik_username;
                auth_request_set $authentik_groups $upstream_http_x_authentik_groups;
                auth_request_set $authentik_entitlements $upstream_http_x_authentik_entitlements;
                auth_request_set $authentik_email $upstream_http_x_authentik_email;
                auth_request_set $authentik_name $upstream_http_x_authentik_name;
                auth_request_set $authentik_uid $upstream_http_x_authentik_uid;

                add_header Set-Cookie $auth_cookie always;
                add_header Cache-Control "no-store" always;

                rewrite ^/api/?(.*)$ /$1 break;

                proxy_pass $retriever_origin;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Request-Id $request_id;
                proxy_set_header X-Forwarded-Proto https;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-authentik-username $authentik_username;
                proxy_set_header X-authentik-groups $authentik_groups;
                proxy_set_header X-authentik-entitlements $authentik_entitlements;
                proxy_set_header X-authentik-email $authentik_email;
                proxy_set_header X-authentik-name $authentik_name;
                proxy_set_header X-authentik-uid $authentik_uid;
                proxy_set_header Connection "";
                proxy_buffering off;
                proxy_request_buffering off;
                proxy_read_timeout 3600s;
                proxy_send_timeout 3600s;
                chunked_transfer_encoding on;
                gzip off;
            }

            location ~ ^/(generate/stream|generate|retrieve|stream)/?$ {
                auth_request /outpost.goauthentik.io/auth/nginx;
                error_page 401 403 = @goauthentik_proxy_signin;

                auth_request_set $auth_cookie $upstream_http_set_cookie;
                auth_request_set $authentik_username $upstream_http_x_authentik_username;
                auth_request_set $authentik_groups $upstream_http_x_authentik_groups;
                auth_request_set $authentik_entitlements $upstream_http_x_authentik_entitlements;
                auth_request_set $authentik_email $upstream_http_x_authentik_email;
                auth_request_set $authentik_name $upstream_http_x_authentik_name;
                auth_request_set $authentik_uid $upstream_http_x_authentik_uid;

                add_header Set-Cookie $auth_cookie always;
                add_header Cache-Control "no-store" always;

                rewrite ^/(generate/stream|generate|retrieve|stream)/?$ /$1 break;

                proxy_pass $retriever_origin;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Request-Id $request_id;
                proxy_set_header X-Forwarded-Proto https;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-authentik-username $authentik_username;
                proxy_set_header X-authentik-groups $authentik_groups;
                proxy_set_header X-authentik-entitlements $authentik_entitlements;
                proxy_set_header X-authentik-email $authentik_email;
                proxy_set_header X-authentik-name $authentik_name;
                proxy_set_header X-authentik-uid $authentik_uid;
                proxy_set_header Connection "";
                proxy_buffering off;
                proxy_request_buffering off;
                proxy_read_timeout 3600s;
                proxy_send_timeout 3600s;
                chunked_transfer_encoding on;
                gzip off;
            }

            location / {
                auth_request /outpost.goauthentik.io/auth/nginx;
                error_page 401 403 = @goauthentik_proxy_signin;

                auth_request_set $auth_cookie $upstream_http_set_cookie;
                auth_request_set $authentik_username $upstream_http_x_authentik_username;
                auth_request_set $authentik_groups $upstream_http_x_authentik_groups;
                auth_request_set $authentik_entitlements $upstream_http_x_authentik_entitlements;
                auth_request_set $authentik_email $upstream_http_x_authentik_email;
                auth_request_set $authentik_name $upstream_http_x_authentik_name;
                auth_request_set $authentik_uid $upstream_http_x_authentik_uid;

                add_header Set-Cookie $auth_cookie always;
                add_header X-authentik-username $authentik_username always;
                add_header X-authentik-groups $authentik_groups always;
                add_header X-authentik-entitlements $authentik_entitlements always;
                add_header X-authentik-email $authentik_email always;
                add_header X-authentik-name $authentik_name always;
                add_header X-authentik-uid $authentik_uid always;
                add_header Cache-Control "no-cache" always;

                try_files $uri /index.html;
            }

            location = /favicon.ico {
                auth_request /outpost.goauthentik.io/auth/nginx;
                error_page 401 403 = @goauthentik_proxy_signin;

                auth_request_set $auth_cookie $upstream_http_set_cookie;
                add_header Set-Cookie $auth_cookie always;

                try_files /assets/images/favicon.ico =404;
                add_header Cache-Control "public, max-age=31536000, immutable" always;
                access_log off;
                log_not_found off;
            }

            location /assets/ {
                auth_request /outpost.goauthentik.io/auth/nginx;
                error_page 401 403 = @goauthentik_proxy_signin;

                auth_request_set $auth_cookie $upstream_http_set_cookie;
                add_header Set-Cookie $auth_cookie always;

                try_files $uri =404;
                add_header Cache-Control "public, max-age=31536000, immutable" always;
                access_log off;
                expires 1y;
            }

            location @goauthentik_proxy_signin {
                internal;
                add_header Set-Cookie $auth_cookie always;
                return 302 https://auth.athithya.site/outpost.goauthentik.io/start?rd=https://$http_host$request_uri;
            }
        }
    }
