apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: compute
spec:
  template:
    metadata:
      labels:
        node-type: compute
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: compute
      taints:
        - key: node-type
          value: compute
          effect: NoSchedule
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values:
            - "c"        - key: karpenter.k8s.aws/instance-generation
          operator: Gte
          values: ["3"]
        - key: karpenter.k8s.aws/instance-family
          operator: NotIn
          values:
            - "t2"
            - "t3"
            - "t4g"      expireAfter: 720h
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 15m
    budgets:
      - nodes: "50%"
  limits:
    cpu: "50"
    nodes: 10
