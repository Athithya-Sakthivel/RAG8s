apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: compute
spec:
  disruption:
    consolidationPolicy: WhenUnderutilized
    budgets:
    - nodes: "50%"
  template:
    metadata:
      labels:
        node-type: compute
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: compute
      taints:
        - key: node-type
          value: compute
          effect: NoSchedule
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values:
            - amd64
        - key: kubernetes.io/os
          operator: In
          values:
            - linux
        - key: karpenter.sh/capacity-type
          operator: In
          values:
            - spot
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values:
            - c
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values:
            - "2"
        - key: karpenter.k8s.aws/instance-family
          operator: NotIn
          values:
            - t2
            - t3
            - t4g
  limits:
    cpu: "50"
