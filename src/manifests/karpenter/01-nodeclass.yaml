apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: compute
spec:
  amiFamily: AL2023
  amiSelectorTerms:
    - alias: al2023@latest
  role: KarpenterNodeRole-rag-eks-prod
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: rag-eks-prod
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: rag-eks-prod
  tags:
    karpenter.sh/discovery: rag-eks-prod
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 50Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true
