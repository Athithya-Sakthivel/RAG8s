          "targets": [{"refId": "A", "expr": "histogram_quantile(0.95, sum(rate(dense_request_duration_seconds_bucket{job=\"fastembed\"}[5m])) by (le))", "legendFormat": "P95"}],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 1},
                  {"color": "red", "value": 5}
                ]
              },
              "custom": {"lineWidth": 2, "fillOpacity": 10, "spanNulls": true},
              "color": {"mode": "thresholds"}
            }
          },
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}}
        },
        {
