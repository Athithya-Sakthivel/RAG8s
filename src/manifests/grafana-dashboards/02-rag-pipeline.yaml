apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-rag-pipeline
  namespace: grafana
  labels:
    grafana_dashboard: "1"
data:
  rag-pipeline.json: |
    {
                   "uid": "rag-pipeline",
                  "title": "RAG Pipeline",
                  "tags": ["rag", "pipeline", "prometheus"],
                  "timezone": "browser",
                  "schemaVersion": 39,
                  "version": 2,
                  "refresh": "30s",
                  "editable": true,
                  "panels": [
                    {
                      "type": "timeseries",
                      "title": "Pipeline Latency P95",
                      "gridPos": {"x": 0, "y": 0, "w": 6, "h": 8},
                      "datasource": {"type": "prometheus", "uid": "prometheus"},
                      "targets": [{"refId": "A", "expr": "histogram_quantile(0.95, rate(retrieval_pipeline_duration_seconds_bucket{job=\"retriever\"}[5m]))", "legendFormat": "P95"}],
                      "fieldConfig": {
                        "defaults": {
                          "unit": "s",
                          "thresholds": {
                            "mode": "absolute",
                            "steps": [
                              {"color": "green", "value": null},
                              {"color": "yellow", "value": 3},
                              {"color": "red", "value": 10}
                            ]
                          },
                          "color": {"mode": "thresholds"},
                          "custom": {"lineWidth": 2, "fillOpacity": 10, "spanNulls": true}
                        }
                      },
                      "options": {"legend": {"displayMode": "list", "placement": "bottom"}}
                    },
                    {
                      "type": "timeseries",
                      "title": "Pipeline Requests/sec",
                      "gridPos": {"x": 6, "y": 0, "w": 6, "h": 8},
                      "datasource": {"type": "prometheus", "uid": "prometheus"},
                      "targets": [{"refId": "A", "expr": "sum(rate(retrieval_pipeline_duration_seconds_count{job=\"retriever\"}[5m]))", "legendFormat": "requests/s"}],
                      "fieldConfig": {
                        "defaults": {
                          "unit": "reqps",
                          "thresholds": {"mode": "absolute", "steps": [{"color": "green"}]},
                          "color": {"mode": "thresholds"},
                          "custom": {"lineWidth": 2, "fillOpacity": 10, "spanNulls": true}
                        }
                      },
                      "options": {"legend": {"displayMode": "list", "placement": "bottom"}}
                    },
                    {
                      "type": "timeseries",
                      "title": "Qdrant Query Latency P95",
                      "gridPos": {"x": 12, "y": 0, "w": 6, "h": 8},
                      "datasource": {"type": "prometheus", "uid": "prometheus"},
                      "targets": [{"refId": "A", "expr": "histogram_quantile(0.95, rate(retrieval_qdrant_query_duration_seconds_bucket{job=\"retriever\"}[5m]))", "legendFormat": "P95"}],
                      "fieldConfig": {
                        "defaults": {
                          "unit": "s",
                          "thresholds": {
                            "mode": "absolute",
                            "steps": [
                              {"color": "green", "value": null},
                              {"color": "yellow", "value": 0.5},
                              {"color": "red", "value": 2}
                            ]
                          },
                          "color": {"mode": "thresholds"},
                          "custom": {"lineWidth": 2, "fillOpacity": 10, "spanNulls": true}
                        }
                      },
                      "options": {"legend": {"displayMode": "list", "placement": "bottom"}}
                    },
                    {
                      "type": "stat",
                      "title": "Cache Hit Ratio",
                      "gridPos": {"x": 18, "y": 0, "w": 6, "h": 8},
                      "datasource": {"type": "prometheus", "uid": "prometheus"},
                      "targets": [{"refId": "A", "expr": "sum(rate(retrieval_cache_lookup_total{job=\"retriever\",result=~\"exact_hit|semantic.*\"}[5m])) / sum(rate(retrieval_cache_lookup_total{job=\"retriever\"}[5m]))"}],
                      "fieldConfig": {
                        "defaults": {
                          "unit": "percentunit",
                          "decimals": 1,
                          "thresholds": {
                            "mode": "absolute",
                            "steps": [
                              {"color": "red", "value": null},
                              {"color": "yellow", "value": 0.3},
                              {"color": "green", "value": 0.6}
                            ]
                          },
                          "color": {"mode": "thresholds"},
                          "noValue": "—"
                        }
                      },
                      "options": {"reduceOptions": {"values": false, "calcs": ["lastNotNull"]}, "textMode": "auto"}
                    },
                    {
                      "type": "timeseries",
                      "title": "Embedding Requests/sec",
                      "gridPos": {"x": 0, "y": 8, "w": 6, "h": 8},
                      "datasource": {"type": "prometheus", "uid": "prometheus"},
                      "targets": [
                        {"refId": "A", "expr": "sum(rate(retrieval_dense_embed_requests_total{job=\"retriever\"}[5m]))", "legendFormat": "dense"},
                        {"refId": "B", "expr": "sum(rate(retrieval_sparse_embed_requests_total{job=\"retriever\"}[5m]))", "legendFormat": "sparse"}
                      ],
                      "fieldConfig": {
                        "defaults": {
                          "unit": "reqps",
                          "thresholds": {"mode": "absolute", "steps": [{"color": "green"}]},
                          "color": {"mode": "thresholds"},
                          "custom": {"lineWidth": 2, "fillOpacity": 10, "spanNulls": true}
                        }
                      },
                      "options": {"legend": {"displayMode": "list", "placement": "bottom"}}
                    },
                    {
                      "type": "timeseries",
                      "title": "Reranker Requests/sec",
                      "gridPos": {"x": 6, "y": 8, "w": 6, "h": 8},
                      "datasource": {"type": "prometheus", "uid": "prometheus"},
                      "targets": [{"refId": "A", "expr": "sum(rate(retrieval_rerank_requests_total{job=\"retriever\"}[5m]))", "legendFormat": "rerank/s"}],
                      "fieldConfig": {
                        "defaults": {
                          "unit": "reqps",
                          "thresholds": {"mode": "absolute", "steps": [{"color": "green"}]},
                          "color": {"mode": "thresholds"},
                          "custom": {"lineWidth": 2, "fillOpacity": 10, "spanNulls": true}
                        }
                      },
                      "options": {"legend": {"displayMode": "list", "placement": "bottom"}}
                    },
                    {
                      "type": "timeseries",
                      "title": "LLM Requests/sec & Latency P95",
                      "gridPos": {"x": 12, "y": 8, "w": 6, "h": 8},
                      "datasource": {"type": "prometheus", "uid": "prometheus"},
                      "targets": [
                        {"refId": "A", "expr": "sum(rate(retrieval_llm_requests_total{job=\"retriever\"}[5m]))", "legendFormat": "req/s"},
                        {"refId": "B", "expr": "histogram_quantile(0.95, rate(retrieval_llm_duration_seconds_bucket{job=\"retriever\"}[5m]))", "legendFormat": "P95 latency"}
                      ],
                      "fieldConfig": {
                        "defaults": {
                          "unit": "short",
                          "thresholds": {
                            "mode": "absolute",
                            "steps": [
                              {"color": "green", "value": null},
                              {"color": "yellow", "value": 5},
                              {"color": "red", "value": 15}
                            ]
                          },
                          "color": {"mode": "thresholds"},
                          "custom": {"lineWidth": 2, "fillOpacity": 10, "spanNulls": true}
                        }
                      },
                      "options": {"legend": {"displayMode": "list", "placement": "bottom"}}
                    },
                    {
                      "type": "timeseries",
                      "title": "Circuit Breakers / Errors",
                      "gridPos": {"x": 18, "y": 8, "w": 6, "h": 8},
                      "datasource": {"type": "prometheus", "uid": "prometheus"},
                      "targets": [
                        {"refId": "A", "expr": "sum(rate(retrieval_circuit_breaker_open_total{job=\"retriever\"}[5m])) by (dependency)", "legendFormat": "breaker: {{dependency}}"},
                        {"refId": "B", "expr": "sum(rate(retrieval_dependency_errors_total{job=\"retriever\"}[5m])) by (dependency)", "legendFormat": "err: {{dependency}}"}
                      ],
                      "fieldConfig": {
                        "defaults": {
                          "unit": "short",
                          "thresholds": {
                            "mode": "absolute",
                            "steps": [
                              {"color": "green", "value": null},
                              {"color": "red", "value": 0}
                            ]
                          },
                          "color": {"mode": "thresholds"},
                          "custom": {"lineWidth": 2, "fillOpacity": 10, "spanNulls": true}
                        }
                      },
                      "options": {"legend": {"displayMode": "list", "placement": "bottom"}}
                    }
                  ],
                  "time": {"from": "now-15m", "to": "now"}
                }