
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-observability-health
  namespace: grafana
  labels:
    grafana_dashboard: "1"
data:
  observability-health.json: |
    {
      "uid": "observability-health",
      "title": "Observability Health",
      "tags": ["observability", "prometheus"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 9,
      "refresh": "30s",
      "editable": true,
      "panels": [
        {
          "type": "stat",
          "title": "Prometheus",
          "gridPos": {"x": 0, "y": 0, "w": 6, "h": 6},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "min(up{job=\"prometheus\"})"}],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "red", "value": null},
                  {"color": "green", "value": 1}
                ]
              },
              "color": {"mode": "thresholds"},
              "decimals": 0
            }
          },
          "options": {"reduceOptions": {"values": false, "calcs": ["lastNotNull"]}, "textMode": "value"}
        },
        {
          "type": "stat",
          "title": "Alertmanager",
          "gridPos": {"x": 6, "y": 0, "w": 6, "h": 6},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "min(up{job=\"alertmanager\"})"}],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "red", "value": null},
                  {"color": "green", "value": 1}
                ]
              },
              "color": {"mode": "thresholds"},
              "decimals": 0
            }
          },
          "options": {"reduceOptions": {"values": false, "calcs": ["lastNotNull"]}, "textMode": "value"}
        },
        {
          "type": "stat",
          "title": "ClickHouse",
          "gridPos": {"x": 12, "y": 0, "w": 6, "h": 6},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "min(up{job=\"clickhouse\"})"}],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "red", "value": null},
                  {"color": "green", "value": 1}
                ]
              },
              "color": {"mode": "thresholds"},
              "decimals": 0
            }
          },
          "options": {"reduceOptions": {"values": false, "calcs": ["lastNotNull"]}, "textMode": "value"}
        },
        {
          "type": "stat",
          "title": "Vector",
          "gridPos": {"x": 18, "y": 0, "w": 6, "h": 6},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "min(up{job=\"vector\"})"}],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "red", "value": null},
                  {"color": "green", "value": 1}
                ]
              },
              "color": {"mode": "thresholds"},
              "decimals": 0
            }
          },
          "options": {"reduceOptions": {"values": false, "calcs": ["lastNotNull"]}, "textMode": "value"}
        },
        {
          "type": "stat",
          "title": "Active Alerts",
          "gridPos": {"x": 0, "y": 6, "w": 6, "h": 6},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "count(ALERTS{alertstate=\"firing\"}) or vector(0)"}],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "red", "value": 1}
                ]
              },
              "color": {"mode": "thresholds"},
              "decimals": 0
            }
          },
          "options": {"reduceOptions": {"values": false, "calcs": ["lastNotNull"]}, "textMode": "value"}
        },
        {
          "type": "stat",
          "title": "Prometheus Storage",
          "gridPos": {"x": 6, "y": 6, "w": 6, "h": 6},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "max(prometheus_tsdb_storage_blocks_bytes)"}],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 40000000000},
                  {"color": "red", "value": 50000000000}
                ]
              },
              "color": {"mode": "thresholds"}
            }
          },
          "options": {"reduceOptions": {"values": false, "calcs": ["lastNotNull"]}, "textMode": "value"}
        },
        {
          "type": "stat",
          "title": "ClickHouse Read-Only",
          "gridPos": {"x": 12, "y": 6, "w": 6, "h": 6},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "max(ClickHouseMetrics_ReadonlyReplica{job=\"clickhouse\"})"}],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "red", "value": 1}
                ]
              },
              "color": {"mode": "thresholds"},
              "decimals": 0
            }
          },
          "options": {"reduceOptions": {"values": false, "calcs": ["lastNotNull"]}, "textMode": "value"}
        },
        {
          "type": "stat",
          "title": "Logs Total",
          "gridPos": {"x": 18, "y": 6, "w": 6, "h": 6},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "ClickHouseProfileEvents_InsertQuery{job=\"clickhouse\"}"}],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null}
                ]
              },
              "color": {"mode": "thresholds"},
              "decimals": 0
            }
          },
          "options": {"reduceOptions": {"values": false, "calcs": ["lastNotNull"]}, "textMode": "value"}
        },
        {
          "type": "timeseries",
          "title": "ClickHouse Insert Rate",
          "gridPos": {"x": 0, "y": 12, "w": 6, "h": 6},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "rate(ClickHouseProfileEvents_InsertQuery{job=\"clickhouse\"}[5m])", "legendFormat": "inserts/s"}],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "red", "value": null},
                  {"color": "green", "value": 0.01}
                ]
              },
              "color": {"mode": "thresholds"},
              "custom": {"lineWidth": 2, "fillOpacity": 10, "spanNulls": true}
            }
          },
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}}
        },
        {
          "type": "timeseries",
          "title": "ClickHouse Memory Tracking",
          "gridPos": {"x": 6, "y": 12, "w": 6, "h": 6},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "sum(ClickHouseMetrics_MemoryTracking{job=\"clickhouse\"})", "legendFormat": "total memory"}],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 12884901888},
                  {"color": "red", "value": 17179869184}
                ]
              },
              "color": {"mode": "thresholds"},
              "custom": {"lineWidth": 2, "fillOpacity": 10, "spanNulls": true}
            }
          },
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}}
        },
        {
          "type": "stat",
          "title": "Buffer Events",
          "gridPos": {"x": 12, "y": 12, "w": 6, "h": 6},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "vector_buffer_events{job=\"vector\"}"}],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 500},
                  {"color": "red", "value": 1000}
                ]
              },
              "color": {"mode": "thresholds"},
              "decimals": 0
            }
          },
          "options": {"reduceOptions": {"values": false, "calcs": ["lastNotNull"]}, "textMode": "value"}
        },
        {
          "type": "stat",
          "title": "Buffer Memory",
          "gridPos": {"x": 18, "y": 12, "w": 6, "h": 6},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "vector_buffer_byte_size{job=\"vector\"}"}],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 52428800},
                  {"color": "red", "value": 104857600}
                ]
              },
              "color": {"mode": "thresholds"},
              "decimals": 0
            }
          },
          "options": {"reduceOptions": {"values": false, "calcs": ["lastNotNull"]}, "textMode": "value"}
        }
      ],
      "time": {"from": "now-15m", "to": "now"}
    }