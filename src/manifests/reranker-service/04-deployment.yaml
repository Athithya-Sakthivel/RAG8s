apiVersion: apps/v1
kind: Deployment
metadata:
  name: reranker-deployment
  namespace: inference
  labels: &id001
    app.kubernetes.io/name: reranker
    app.kubernetes.io/component: reranker
    app.kubernetes.io/managed-by: gen_reranker
    app.kubernetes.io/instance: reranker
    env: nonprod
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: reranker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  template:
    metadata:
      labels: *id001
      annotations:
        gen-reranker/inputs-hash: af63dfccc62d573bcd620b7bb3ab35824471814109fab1dd1f0ad79de176f52d
    spec:
      serviceAccountName: reranker-sa
      containers:
      - name: reranker
        image: ghcr.io/athithya-sakthivel/reranker:2026-04-26-08-57--a0cce10@sha256:2faec17dc969915508635a582151817dbbc33301aaa2d976490a6fedc73d9b13
        ports:
        - containerPort: 8202
        env:
        - name: RERANKER_HOST
          value: 0.0.0.0
        - name: RERANKER_PORT
          value: '8202'
        - name: RERANKER_LOGLEVEL
          value: WARN
        - name: RERANKER_MODEL_NAME
