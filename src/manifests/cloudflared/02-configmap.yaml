apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: inference
  labels:
    app.kubernetes.io/name: cloudflared
    app.kubernetes.io/component: tunnel-config
data:
  config.yaml: |
    tunnel: default-tunnel-1
    ingress:
    - hostname: athithya.site
      service: http://frontend.inference.svc.cluster.local:8000
      originRequest:
        connectTimeout: 10s
        keepAliveTimeout: 30s
        noTLSVerify: true
        disableChunkedEncoding: true
    - service: http_status:404
