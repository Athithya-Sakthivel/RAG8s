apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: inference
  labels:
    app.kubernetes.io/name: cloudflared
    app.kubernetes.io/component: tunnel-config
data:
  config.yaml: |
    tunnel: default-tunnel-1
    protocol: http2
    ingress:
    - hostname: auth.athithya.site
      service: http://authentik-server.authentik.svc.cluster.local:80
    - hostname: api.athithya.site
      service: http://frontend-nginx.inference.svc.cluster.local:8080
    - hostname: athithya.site
      service: http://frontend-nginx.inference.svc.cluster.local:8080
    - service: http_status:404
