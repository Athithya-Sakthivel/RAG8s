apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-routes-reference
  namespace: inference
  labels:
    app.kubernetes.io/name: cloudflared
    app.kubernetes.io/component: tunnel-reference
data:
  routes.yaml: |
    tunnel: default-tunnel-1
    ingress:
    - hostname: argocd.rag.athithya.site
      service: http://argocd-server.argocd.svc.cluster.local:80
    - hostname: grafana.rag.athithya.site
      service: http://grafana.grafana.svc.cluster.local:80
    - hostname: rag.athithya.site
      path: /metrics
      service: http_status:403
    - hostname: rag.athithya.site
      path: /healthz
      service: http_status:403
    - hostname: rag.athithya.site
      path: /readyz
      service: http_status:403
    - hostname: rag.athithya.site
      service: http://frontend.inference.svc.cluster.local:8000
      originRequest:
        connectTimeout: 10s
        keepAliveTimeout: 30s
        disableChunkedEncoding: false
    - service: http_status:404
