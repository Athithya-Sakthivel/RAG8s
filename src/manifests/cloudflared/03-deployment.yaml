apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: inference
  labels:
    app.kubernetes.io/name: cloudflared
    app.kubernetes.io/component: tunnel
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
      app.kubernetes.io/component: tunnel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflared
        app.kubernetes.io/component: tunnel
      annotations:
        cloudflared/config-checksum: 56d3a9cf57be03138b66687a84c983238ee3f5582d382f25c1685b97d1292d2d
        prometheus.io/scrape: 'true'
        prometheus.io/port: '2000'
    spec:
      serviceAccountName: cloudflared-sa
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: cloudflared
            app.kubernetes.io/component: tunnel
      priorityClassName: system-cluster-critical
      volumes:
      - name: cloudflared-config
        configMap:
          name: cloudflared-config
          items:
          - key: config.yaml
            path: config.yaml
      containers:
      - name: cloudflared
        image: cloudflare/cloudflared:2026.3.0@sha256:6b599ca3e974349ead3286d178da61d291961182ec3fe9c505e1dd02c8ac31b0
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 512Mi
        command:
        - cloudflared
        args:
        - tunnel
        - --no-autoupdate
        - --loglevel
        - info
        - --protocol
        - http2
        - --metrics
        - 0.0.0.0:2000
        - --config
        - /etc/cloudflared/config.yaml
        - run
        env:
        - name: TUNNEL_TOKEN
          valueFrom:
            secretKeyRef:
              name: cloudflared-token
              key: token
        - name: TUNNEL_METRICS
          value: 'true'
        ports:
        - name: metrics
          containerPort: 2000
          protocol: TCP
        volumeMounts:
        - name: cloudflared-config
          mountPath: /etc/cloudflared
          readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          capabilities:
            drop:
            - ALL
        startupProbe:
          httpGet:
            path: /ready
            port: 2000
          periodSeconds: 2
          failureThreshold: 30
          timeoutSeconds: 1
        readinessProbe:
          httpGet:
            path: /ready
            port: 2000
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 3
          timeoutSeconds: 1
        livenessProbe:
          httpGet:
            path: /ready
            port: 2000
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
          timeoutSeconds: 1
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/sh
              - -c
              - sleep 5 && kill -SIGTERM 1
      restartPolicy: Always
      dnsPolicy: ClusterFirst
