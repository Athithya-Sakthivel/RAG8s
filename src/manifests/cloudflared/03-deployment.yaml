spec:
  serviceAccountName: dense-sa
  nodeSelector:
    node-type: compute
  tolerations:
    - key: "node-type"
      operator: "Equal"
      value: "compute"
      effect: "NoSchedule"
  containers:
  - name: dense
    image: ghcr.io/athithya-sakthivel/dense:2026-05-06-06-15--70eca4b@sha256:c8a9fbb234cb355f530b3ecf6a14c1ebbecbaf24b74e6c865ca79a0073afbe70
    ports:
    - containerPort: 8200
    env:
    - name: ENV
      value: NONPROD
    - name: DEPLOY_ENV
      value: NONPROD
    - name: DENSE_HOST
      value: 0.0.0.0
    - name: DENSE_PORT
      value: '8200'
    - name: DENSE_LOGLEVEL
      value: WARN
    - name: DENSE_MODEL_NAME
      value: BAAI/bge-small-en-v1.5
    - name: DENSE_DIM
      value: '384'
    - name: DENSE_BATCH_SIZE
      value: '16'
    - name: DENSE_NORMALIZE
      value: '1'
    - name: DENSE_CUDA
      value: '0'
    - name: PRELOAD_MODEL
      value: '1'
    livenessProbe:
      httpGet:
        path: /health
        port: 8200
      initialDelaySeconds: 30
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 6
    readinessProbe:
      httpGet:
        path: /readyz
        port: 8200
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
    startupProbe:
      httpGet:
        path: /readyz
        port: 8200
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 60
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
    volumeMounts:
    - name: tmp-writable
      mountPath: /tmp
    - name: tmp-writable
      mountPath: /var/tmp
    - name: tmp-writable
      mountPath: /usr/tmp
    - name: models-cache
      mountPath: /models_cache
  securityContext:
    fsGroup: 1000
    runAsNonRoot: true
  volumes:
  - name: tmp-writable
    emptyDir: {}
  - name: models-cache
    emptyDir: {}