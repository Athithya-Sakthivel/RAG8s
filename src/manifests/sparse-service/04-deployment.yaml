apiVersion: apps/v1
kind: Deployment
metadata:
  name: sparse-deployment
  namespace: inference
  labels: &id001
    app.kubernetes.io/name: sparse
    app.kubernetes.io/component: embedder
    app.kubernetes.io/managed-by: gen_sparse
    app.kubernetes.io/instance: sparse
    env: nonprod
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sparse
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  template:
    metadata:
      labels: *id001
    spec:
      serviceAccountName: sparse-sa
      containers:
      - name: sparse
        image: ghcr.io/athithya-sakthivel/sparse:2026-05-06-06-26--13b7433@sha256:e977f4eedd896f28de999809eefe8db7c2048dc7fb9f7700d450a333449d334b
        ports:
        - containerPort: 8201
        env:
        - name: SPARSE_HOST
          value: 0.0.0.0
        - name: SPARSE_PORT
          value: '8201'
        - name: SPARSE_LOGLEVEL
          value: WARN
        - name: SPARSE_MODEL_NAME
          value: Qdrant/minicoil-v1
        - name: SPARSE_BATCH_SIZE
          value: '8'
        - name: SPARSE_CUDA
          value: '0'
        - name: PRELOAD_MODEL
          value: '0'
        - name: ENV
          value: NONPROD
        livenessProbe:
          httpGet:
            path: /health
            port: 8201
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 6
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8201
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /readyz
            port: 8201
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 60
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: tmp-writable
          mountPath: /tmp
        - name: tmp-writable
          mountPath: /var/tmp
        - name: tmp-writable
          mountPath: /usr/tmp
        - name: models-cache
          mountPath: /models_cache
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
      volumes:
      - name: tmp-writable
        emptyDir: {}
      - name: models-cache
        emptyDir: {}
