apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: inference
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/instance: frontend
    app.kubernetes.io/managed-by: frontend-manifest-generator
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
      app.kubernetes.io/instance: frontend
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/instance: frontend
        app.kubernetes.io/managed-by: frontend-manifest-generator
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: frontend
    spec:
      serviceAccountName: frontend
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 1000
      volumes:
        - name: tmp
          emptyDir: {}
        - name: static-files
          emptyDir: {}
      containers:
        - name: frontend
          image: ghcr.io/athithya-sakthivel/frontend:2026-05-12-09-42--adaa9e3@sha256:7a22eeb96d7d16d9583c0bac4f1d68c3b33fb7c6b8698956a5849c7aaed55b0e
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SERVICE_NAME
              value: frontend
            - name: ENV
              value: PROD
            - name: LOG_LEVEL
              value: INFO
            - name: ENABLE_PROMETHEUS
              value: "true"
            - name: PROMETHEUS_PATH
              value: /metrics
            - name: REQUIRE_AUTH
              value: "true"
            - name: ENABLE_GOOGLE_AUTH
              value: "true"
            - name: ENABLE_MICROSOFT_AUTH
              value: "true"
            - name: ENABLE_GITHUB_AUTH
              value: "false"
            - name: DISPLAY_SOURCES_IN_UI
              value: "true"
            - name: DISPLAY_TOPK_IN_UI
              value: "false"
            - name: USE_IAM
              value: "false"
            - name: RATE_LIMIT_GENERATE_STREAM
              value: 5/minute
            - name: RATE_LIMIT_AUTH_ME
              value: 30/minute
            - name: RATE_LIMIT_STREAM_CONCURRENCY
              value: "10"
            - name: RATE_LIMIT_AUTH_LOGIN
              value: 10/minute
            - name: RATE_LIMIT_AUTH_START
              value: 5/minute
            - name: RATE_LIMIT_AUTH_CALLBACK
              value: 20/minute
            - name: RATE_LIMIT_AUTH_LOGOUT
              value: 20/minute
            - name: JWT_ISS
              value: stateless-openid-auth
            - name: JWT_AUD
              value: rag-ui
            - name: JWT_TTL_SECONDS
              value: "900"
            - name: JWT_CLOCK_SKEW_SECONDS
              value: "90"
            - name: JWT_KID
              value: production-key-1
            - name: GOOGLE_ALLOWED_DOMAINS
              value: "gmail.com"
            - name: MICROSOFT_ALLOWED_DOMAINS
              value: "outlook.com"
            - name: MICROSOFT_ALLOWED_TENANT_IDS
              value: b8a65a11-9d1c-4d48-b9f6-dabfc67f2e4b
            - name: GITHUB_ALLOWED_ORGS
              value: ""
            - name: FRONTEND_HOSTNAME
              value: rag.athithya.site
            - name: MS_TENANT_ID
              value: b8a65a11-9d1c-4d48-b9f6-dabfc67f2e4b
            - name: RETRIEVER_URL
              value: http://retriever.inference.svc.cluster.local:8001
            - name: GENERATE_STREAM_PATH
              value: /generate/stream
            - name: UPSTREAM_TIMEOUT_SECONDS
              value: "60"
            - name: VALKEY_SERVICE_HOST
              value: valkey.valkey.svc.cluster.local
            - name: VALKEY_SERVICE_PORT
              value: "6379"
            - name: ENABLE_PRESIGNED_URLS
              value: "true"
            - name: PRESIGNED_URL_TTL_SECONDS
              value: "3600"
          envFrom:
            - secretRef:
                name: frontend-secrets
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: tmp
              mountPath: /var/tmp
            - name: static-files
              mountPath: /app/static
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /health
              port: 8000
              scheme: HTTP
            initialDelaySeconds: 5
            timeoutSeconds: 5
            periodSeconds: 5
            failureThreshold: 12
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
              scheme: HTTP
            initialDelaySeconds: 0
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /orchestrator/health
              port: 8000
              scheme: HTTP
            initialDelaySeconds: 0
            timeoutSeconds: 5
            periodSeconds: 5
            failureThreshold: 2
            successThreshold: 1
