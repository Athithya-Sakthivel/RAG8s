apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vector
  namespace: logging
  labels:
    app.kubernetes.io/name: vector
    app.kubernetes.io/component: logging
    app.kubernetes.io/managed-by: vector.py
spec:
  selector:
    matchLabels:
      app: vector
  template:
    metadata:
      labels:
        app: vector
        app.kubernetes.io/name: vector
        app.kubernetes.io/component: logging
        app.kubernetes.io/managed-by: vector.py
      annotations:
        vector/config-checksum: 591707827666cf99faba6ef22141e24b9ed1b0f349511bdba5673ca3d426ca73
    spec:
      serviceAccountName: vector
      
      # === FIX: Run on ALL worker nodes ===
      # No nodeSelector - DaemonSet runs on all nodes by default
      
      # === FIX: Explicit tolerations for both nodegroups ===
      tolerations:
      # Tolerate compute nodes (they have NoSchedule taint)
      - key: "node-type"
        operator: "Equal"
        value: "compute"
        effect: "NoSchedule"
      # No toleration needed for general nodes (they're untainted)
      
      # Optional: Also tolerate any future control-plane taints if needed
      # - key: "node-role.kubernetes.io/master"
      #   operator: "Exists"
      #   effect: "NoSchedule"
      
      initContainers:
      - name: fix-data-dir-permissions
        image: busybox:1.37.0
        command:
        - sh
        - -c
        - mkdir -p /var/lib/vector && chown -R 65534:65534 /var/lib/vector
        volumeMounts:
        - name: data-dir
          mountPath: /var/lib/vector
        securityContext:
          runAsUser: 0
          runAsNonRoot: false
          allowPrivilegeEscalation: false
      volumes:
      - name: vector-config
        configMap:
          name: vector-config
          items:
          - key: vector.toml
            path: vector.toml
      - name: data-dir
        hostPath:
          path: /var/lib/vector
          type: DirectoryOrCreate
      - name: pod-logs
        hostPath:
          path: /var/log/pods
          type: Directory
      containers:
      - name: vector
        image: timberio/vector:0.55.0-distroless-static
        args:
        - -c
        - /etc/vector/vector.toml
        ports:
        - name: metrics
          containerPort: 9598
        env:
        - name: CLICKHOUSE_USER
          valueFrom:
            secretKeyRef:
              name: clickhouse-credentials
              key: username
        - name: CLICKHOUSE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: clickhouse-credentials
              key: password
        - name: VECTOR_SELF_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        volumeMounts:
        - name: vector-config
          mountPath: /etc/vector/vector.toml
          subPath: vector.toml
          readOnly: true
        - name: data-dir
          mountPath: /var/lib/vector
        - name: pod-logs
          mountPath: /var/log/pods
          readOnly: true
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 0
          capabilities:
            drop:
            - ALL