apiVersion: v1
kind: ServiceAccount
metadata:
  name: vector
  namespace: logging
  labels:
    app.kubernetes.io/name: vector
    app.kubernetes.io/component: logging
    app.kubernetes.io/managed-by: vector.py
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vector-log-reader
  labels:
    app.kubernetes.io/name: vector
    app.kubernetes.io/component: logging
    app.kubernetes.io/managed-by: vector.py
rules:
- apiGroups:
  - ''
  resources:
  - pods
  - namespaces
  - nodes
  verbs:
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vector-log-reader
  labels:
    app.kubernetes.io/name: vector
    app.kubernetes.io/component: logging
    app.kubernetes.io/managed-by: vector.py
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vector-log-reader
subjects:
- kind: ServiceAccount
  name: vector
  namespace: logging
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vector-config
  namespace: logging
  labels:
    app.kubernetes.io/name: vector
    app.kubernetes.io/component: logging
    app.kubernetes.io/managed-by: vector.py
data:
  vector.toml: "data_dir = \"/var/lib/vector\"\n\n[api]\nenabled = true\naddress =\
    \ \"0.0.0.0:8686\"\n\n[sources.kube_logs]\ntype = \"kubernetes_logs\"\nauto_partial_merge\
    \ = true\nself_node_name = \"${VECTOR_SELF_NODE_NAME}\"\nignore_older_secs = 1_000_000_000\n\
    read_from = \"beginning\"\n\n[sources.internal_metrics]\ntype = \"internal_metrics\"\
    \n\n[transforms.decode_service_schema]\ntype = \"remap\"\ninputs = [\"kube_logs\"\
    ]\nsource = \"\"\"\nif is_string(.message) {\n  parsed, err = parse_json(.message)\n\
    \  if err == null && is_object(parsed) {\n    . = merge!(., parsed, true)\n  }\n\
    }\n\"\"\"\n\n[transforms.drop_excluded_namespaces]\ntype = \"filter\"\ninputs\
    \ = [\"decode_service_schema\"]\ncondition = \"\"\"\n!is_string(.kubernetes.pod_namespace)\
    \ || !includes([\"kube-system\", \"cert-manager\", \"monitoring\"], .kubernetes.pod_namespace)\n\
    \"\"\"\n\n[sinks.clickhouse]\ntype = \"clickhouse\"\ninputs = [\"drop_excluded_namespaces\"\
    ]\nendpoint = \"http://clickhouse.logging.svc.cluster.local:8123\"\ndatabase =\
    \ \"logs\"\ntable = \"inference_logs\"\nformat = \"json_each_row\"\ncompression\
    \ = \"gzip\"\nskip_unknown_fields = true\n\n[sinks.clickhouse.auth]\nstrategy\
    \ = \"basic\"\nuser = \"${CLICKHOUSE_USER}\"\npassword = \"${CLICKHOUSE_PASSWORD}\"\
    \n\n[sinks.clickhouse.batch]\nmax_events = 200\ntimeout_secs = 2.0\n\n[sinks.clickhouse.healthcheck]\n\
    enabled = true\n\n[sinks.prometheus_exporter]\ntype = \"prometheus_exporter\"\n\
    inputs = [\"internal_metrics\"]\naddress = \"0.0.0.0:9598\"\n"
---
apiVersion: v1
kind: Service
metadata:
  name: vector-metrics
  namespace: logging
  labels:
    app.kubernetes.io/name: vector
    app.kubernetes.io/component: logging
    app.kubernetes.io/managed-by: vector.py
spec:
  selector:
    app: vector
  ports:
  - name: metrics
    port: 9598
    targetPort: 9598
  type: ClusterIP
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vector
  namespace: logging
  labels:
    app.kubernetes.io/name: vector
    app.kubernetes.io/component: logging
    app.kubernetes.io/managed-by: vector.py
spec:
  selector:
    matchLabels:
      app: vector
  template:
    metadata:
      labels:
        app: vector
        app.kubernetes.io/name: vector
        app.kubernetes.io/component: logging
        app.kubernetes.io/managed-by: vector.py
      annotations:
        vector/config-checksum: 38afafa9d47903124ac3a48c4b3696e332a46c9438986f6ff6903b22734a6e2a
    spec:
      serviceAccountName: vector
      tolerations:
      - operator: Exists
      initContainers:
      - name: fix-data-dir-permissions
        image: busybox:1.37.0
        command:
        - sh
        - -c
        - mkdir -p /var/lib/vector && chown -R 65534:65534 /var/lib/vector
        volumeMounts:
        - name: data-dir
          mountPath: /var/lib/vector
        securityContext:
          runAsUser: 0
          runAsNonRoot: false
          allowPrivilegeEscalation: false
      volumes:
      - name: vector-config
        configMap:
          name: vector-config
          items:
          - key: vector.toml
            path: vector.toml
      - name: data-dir
        hostPath:
          path: /var/lib/vector
          type: DirectoryOrCreate
      - name: pod-logs
        hostPath:
          path: /var/log/pods
          type: Directory
      containers:
      - name: vector
        image: timberio/vector:0.55.0-distroless-static
        args:
        - -c
        - /etc/vector/vector.toml
        ports:
        - name: metrics
          containerPort: 9598
        env:
        - name: CLICKHOUSE_USER
          valueFrom:
            secretKeyRef:
              name: clickhouse-credentials
              key: username
        - name: CLICKHOUSE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: clickhouse-credentials
              key: password
        - name: VECTOR_SELF_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        volumeMounts:
        - name: vector-config
          mountPath: /etc/vector/vector.toml
          subPath: vector.toml
          readOnly: true
        - name: data-dir
          mountPath: /var/lib/vector
        - name: pod-logs
          mountPath: /var/log/pods
          readOnly: true
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 0
          capabilities:
            drop:
            - ALL
