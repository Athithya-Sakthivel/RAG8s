---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: retriever
  namespace: inference
  labels:
    app.kubernetes.io/name: retriever
    app.kubernetes.io/instance: retriever
    app.kubernetes.io/managed-by: retriever-manifest-generator
    app.kubernetes.io/component: retriever
  annotations:
    retriever.io/config-sha256: 826a76e435ec948b083a9868408d4e7b77cde9779d7b934bbfb078530e036898
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: retriever
      app.kubernetes.io/instance: retriever
      app.kubernetes.io/component: retriever
  template:
    metadata:
      labels:
        app.kubernetes.io/name: retriever
        app.kubernetes.io/instance: retriever
        app.kubernetes.io/managed-by: retriever-manifest-generator
        app.kubernetes.io/component: retriever
        app.kubernetes.io/part-of: retriever
      annotations:
        retriever.io/config-sha256: 826a76e435ec948b083a9868408d4e7b77cde9779d7b934bbfb078530e036898
    spec:
      serviceAccountName: retriever-sa
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      volumes:
      - name: tmp
        emptyDir: {}
      containers:
      - name: retriever
        image: ghcr.io/athithya-sakthivel/retriever:2026-04-28-19-39--fed2269@sha256:896c6bad7dbba0eaa07a1e317900e98773c2da6439769c3c6ba48e45548f9800
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8001
          protocol: TCP
        env:
        - name: INSTANCE_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: USE_IAM
          value: 'false'
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: retriever-secrets
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: retriever-secrets
              key: AWS_SECRET_ACCESS_KEY
        - name: SERVICE_NAME
          value: retrieval
        - name: OTEL_SERVICE_NAME
          value: retrieval
        - name: SERVICE_VERSION
          value: v1
        - name: OTEL_SERVICE_VERSION
          value: v1
        - name: ENV
          value: prod
        - name: DEPLOYMENT_ENVIRONMENT
          value: prod
        - name: CLUSTER_NAME
          value: production-cluster
        - name: K8S_CLUSTER_NAME
          value: production-cluster
        - name: AWS_REGION
          value: ap-south-1
        - name: AWS_DEFAULT_REGION
          value: ap-south-1
        - name: QDRANT_URL
          value: http://qdrant.qdrant.svc.cluster.local:6333
        - name: COLLECTION_NAME
          value: default_rag_collection1
        - name: CACHE_COLLECTION_NAME
          value: default_rag_collection1__semantic_cache
        - name: DENSE_URL
          value: http://dense-svc.models.svc.cluster.local:8200
        - name: SPARSE_URL
          value: http://sparse-svc.models.svc.cluster.local:8201
        - name: RERANKER_URL
          value: http://reranker-svc.models.svc.cluster.local:8202
        - name: AWS_BEDROCK_MODEL_ID
          value: meta.llama3-8b-instruct-v1:0
        - name: LLM_PROMPT_TEMPLATE
          value: 'You are a knowledge assistant who must explain explicitly to an
            end-user by referring ONLY to the provided passages BELOWYou MUST end
            every passage with a citation in the exact format [n], where n is one
            of the numbered passage blocks.Use ONLY the provided passage numbers.
            Do NOT output filenames, secrets, URLs, page numbers, or any other metadata.
            Do NOT invent citations.PASSAGES:

            {passages}


            QUESTION: {question}


            Answer:'
        - name: LLM_MAX_TOKENS
          value: '400'
        - name: LLM_TEMPERATURE
          value: '0.0'
        - name: BEDROCK_GUARDRAIL_IDENTIFIER
          value: ''
        - name: BEDROCK_GUARDRAIL_VERSION
          value: ''
        - name: CORPUS_VERSION
          value: v1
        - name: PROMPT_VERSION
          value: v1
        - name: RETRIEVAL_VERSION
          value: retrieval-v1
        - name: TENANT_ID
          value: ''
        - name: DENSE_DIM
          value: '384'
        - name: MAX_CHUNKS_TO_LLM
          value: '5'
        - name: QUERY_TOPK_DENSE
          value: '50'
        - name: QUERY_TOPK_SPARSE
          value: '50'
        - name: FETCH_K
          value: '20'
        - name: RERANKER_TOP_K
          value: '10'
        - name: RERANKER_MODE
          value: AUTO
        - name: RERANK_AUTO_THRESHOLD
          value: '0.75'
        - name: RERANK_MARGIN
          value: '0.08'
        - name: RERANK_ALPHA
          value: '0.6'
        - name: RRF_K
          value: '60'
        - name: CACHE_SCORE_THRESHOLD
          value: '0.72'
        - name: CACHE_TTL_SECONDS
          value: '86400'
        - name: CACHE_CLEANUP_INTERVAL_SECONDS
          value: '900'
        - name: PROMPT_MAX_CONTENT_CHARS
          value: '2500'
        - name: CHUNK_OUTPUT_MAX_CHARS
          value: '1600'
        - name: MAX_PROMPT_CHARS
          value: '40000'
        - name: MAX_CONCURRENT_REQUESTS
          value: '64'
        - name: HTTP_TIMEOUT
          value: '10.0'
        - name: HTTP_MAX_CONNECTIONS
          value: '100'
        - name: HTTP_MAX_KEEPALIVE
          value: '20'
        - name: RETRY_MAX_ATTEMPTS
          value: '3'
        - name: RETRY_BASE_DELAY
          value: '0.08'
        - name: RETRY_MAX_DELAY
          value: '0.8'
        - name: BREAKER_FAILURE_THRESHOLD
          value: '3'
        - name: BREAKER_RESET_TIMEOUT
          value: '20.0'
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://signoz-otel-collector.signoz.svc.cluster.local:4317
        - name: OTEL_TIMEOUT_SECONDS
          value: '5.0'
        - name: OTEL_METRIC_EXPORT_INTERVAL_MS
          value: '15000'
        - name: OTEL_METRIC_EXPORT_TIMEOUT_MS
          value: '10000'
        - name: OTEL_TRACES_SAMPLER
          value: parentbased_traceidratio
        - name: OTEL_TRACES_SAMPLER_ARG
          value: '0.10'
        - name: LOG_LEVEL
          value: WARNING
        - name: ENABLE_OTEL_TRACES
          value: 'true'
        - name: ENABLE_OTEL_METRICS
          value: 'true'
        - name: ENABLE_OTEL_LOGS
          value: 'true'
        - name: AUTH_VALIDATE_URL
          value: http://auth-svc.inference.svc.cluster.local:8000/me
        - name: AUTH_TIMEOUT_SECONDS
          value: '2.0'
        - name: PORT
          value: '8001'
        - name: UVICORN_LOOP
          value: uvloop
        - name: UVICORN_HTTP
          value: httptools
        - name: FORWARDED_ALLOW_IPS
          value: '*'
        - name: SEMANTIC_CACHE_SCORE_THRESHOLD
          value: ''
        - name: SEMANTIC_CACHE_RELAXED_SCORE_THRESHOLD
          value: ''
        - name: RERANKER_MODEL
          value: cross-encoder
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '1'
            memory: 1Gi
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8001
            scheme: HTTP
          initialDelaySeconds: 0
          timeoutSeconds: 5
          periodSeconds: 5
          failureThreshold: 12
          successThreshold: 1
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8001
            scheme: HTTP
          initialDelaySeconds: 0
          timeoutSeconds: 5
          periodSeconds: 5
          failureThreshold: 12
          successThreshold: 1
        startupProbe:
          httpGet:
            path: /healthz
            port: 8001
            scheme: HTTP
          initialDelaySeconds: 0
          timeoutSeconds: 5
          periodSeconds: 5
          failureThreshold: 12
          successThreshold: 1
