apiVersion: apps/v1
kind: Deployment
metadata:
  name: reranker-deployment
  namespace: models
  labels: &id001
    app.kubernetes.io/name: reranker
    app.kubernetes.io/component: reranker
    app.kubernetes.io/managed-by: gen_reranker
    app.kubernetes.io/instance: reranker
    env: nonprod
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: reranker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  template:
    metadata:
      labels: *id001
      annotations:
        gen-reranker/inputs-hash: 6b4af1a28ab20c1d049a154dbb5b688bf8e84a504e9cb6d906a6630fec8c7370
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8202'
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: reranker-sa
      containers:
      - name: reranker
        image: ghcr.io/athithya-sakthivel/reranker:2026-04-24-16-22--7f601ca@sha256:62d8a0254ac5adb19718477c1bc2c25deeeba41cd25a5a6e53d672ccb4b70d4d
        ports:
        - containerPort: 8202
        env:
        - name: RERANKER_HOST
          value: 0.0.0.0
        - name: RERANKER_PORT
          value: '8202'
        - name: RERANKER_LOGLEVEL
          value: INFO
        - name: RERANKER_MODEL_NAME
          value: Xenova/ms-marco-MiniLM-L-6-v2
        - name: RERANKER_MAX_DOCS
          value: '50'
        - name: RERANKER_CUDA
          value: '0'
        - name: PRELOAD_MODEL
          value: '0'
        - name: ENV
          value: NONPROD
        livenessProbe:
          httpGet:
            path: /health
            port: 8202
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 6
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8202
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /readyz
            port: 8202
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 60
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
