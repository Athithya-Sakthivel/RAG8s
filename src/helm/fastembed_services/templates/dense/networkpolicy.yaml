{{- if and .Values.dense.enabled .Values.global.networkPolicy.enabled }}
{{- $service := "dense" }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "fastembed.networkPolicyName" (dict "service" $service) }}
  namespace: {{ .Values.dense.namespace }}
  labels:
    {{- include "fastembed.labels" (dict "Chart" .Chart "Release" .Release "name" "dense" "component" "embedder" "instance" "dense") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "fastembed.selectorLabels" (dict "name" "dense" "component" "embedder" "instance" "dense") | nindent 6 }}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow from allowed namespaces
  {{- range .Values.global.networkPolicy.allowedNamespaces }}
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ . }}
    ports:
    - port: 8200
      protocol: TCP
  {{- end }}
  # Allow from pods with allowed service accounts
  {{- range .Values.global.networkPolicy.allowedServiceAccounts }}
  - from:
    - podSelector:
        matchLabels:
          fastembed.io/service-account: {{ . }}
    ports:
    - port: 8200
      protocol: TCP
  {{- end }}
  egress:
  # DNS
  - to:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
  # Allow all egress to internet (for model downloads, etc.)
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
{{- end }}