{{- if .Values.dense.enabled }}
{{- $service := "dense" }}
{{- $component := "embedder" }}
{{- $name := "dense" }}
{{- $labels := dict "name" $name "component" $component "instance" $name }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fastembed.deploymentName" (dict "service" $service) }}
  namespace: {{ .Values.dense.namespace }}
  labels:
    {{- include "fastembed.labels" (dict "Chart" .Chart "Release" .Release "name" $name "component" $component "instance" $name) | nindent 4 }}
spec:
  {{- if not .Values.dense.hpa.enabled }}
  replicas: {{ .Values.dense.replicas }}
  {{- else }}
  replicas: {{ .Values.dense.hpa.min }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "fastembed.selectorLabels" $labels | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  template:
    metadata:
      labels:
        {{- include "fastembed.podLabels" $labels | nindent 8 }}
    spec:
      serviceAccountName: {{ include "fastembed.serviceAccountName" (dict "service" $service) }}
      nodeSelector:
        {{- toYaml .Values.global.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.global.tolerations | nindent 8 }}
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
      containers:
      - name: {{ $name }}
        image: {{ .Values.dense.embedderImage }}
        ports:
        - containerPort: 8200
        env:
        - name: ENV
          value: {{ .Values.global.logLevel | upper | quote }}
        - name: DENSE_HOST
          value: "0.0.0.0"
        - name: DENSE_PORT
          value: "8200"
        - name: DENSE_LOGLEVEL
          value: {{ .Values.global.logLevel | upper | quote }}
        - name: DENSE_MODEL_NAME
          value: {{ .Values.dense.modelName | quote }}
        - name: DENSE_DIM
          value: {{ .Values.dense.dim | quote }}
        - name: DENSE_BATCH_SIZE
          value: {{ .Values.dense.batchSize | quote }}
        - name: DENSE_NORMALIZE
          value: "1"
        - name: DENSE_CUDA
          value: {{ if and .Values.global.cuda (gt (int .Values.dense.gpuCount) 0) }}"1"{{ else }}"0"{{ end }}
        - name: PRELOAD_MODEL
          value: "1"
        livenessProbe:
          httpGet:
            path: /health
            port: 8200
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 6
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8200
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /readyz
            port: 8200
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 60
        resources:
          {{- toYaml .Values.dense.hpa.resources | nindent 10 }}
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: tmp-writable
          mountPath: /tmp
        - name: tmp-writable
          mountPath: /var/tmp
        - name: tmp-writable
          mountPath: /usr/tmp
        - name: models-cache
          mountPath: /models_cache
      volumes:
      - name: tmp-writable
        emptyDir: {}
      - name: models-cache
        emptyDir: {}
{{- end }}