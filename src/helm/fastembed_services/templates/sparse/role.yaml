{{- if .Values.sparse.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "fastembed.roleName" (dict "service" "sparse") }}
  namespace: {{ .Values.sparse.namespace }}
  labels:
    {{- include "fastembed.labels" (dict "Chart" .Chart "Release" .Release "name" "sparse" "component" "embedder" "instance" "sparse") | nindent 4 }}
rules:
- apiGroups:
  - ''
  resources:
  - pods
  - services
  - endpoints
  - configmaps
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ''
  resources:
  - secrets
  verbs:
  - get
{{- end }}