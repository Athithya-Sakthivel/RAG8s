name: Base indexing image CI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Custom tag (defaults to latest)'
        required: false
        default: 'latest'

permissions:
  contents: read
  packages: write

concurrency:
  group: base-indexing-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GHCR_USER: athithya-sakthivel
  IMAGE_NAME: indexing-pipeline-base

jobs:
  build-push-base:
    name: Build and push base image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: staging

    env:
      GIT_PAT: ${{ secrets.GIT_PAT }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      - name: Compute tags
        id: tags
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || 'latest' }}"
          TIMESTAMP_TAG="$(TZ=Asia/Kolkata date +%Y-%m-%d-%H-%M)"
          IMAGE="ghcr.io/${GHCR_USER}/${IMAGE_NAME}"
          echo "image=${IMAGE}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "timestamp_tag=${TIMESTAMP_TAG}" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ghcr.io
          username: ${{ env.GHCR_USER }}
          password: ${{ env.GIT_PAT }}

      - name: Build and push base image
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294
        with:
          context: src/indexing_pipeline          # contains Dockerfile.base
          file: src/indexing_pipeline/Dockerfile.base
          push: true
          pull: true
          tags: |
            ${{ steps.tags.outputs.image }}:${{ steps.tags.outputs.tag }}
            ${{ steps.tags.outputs.image }}:${{ steps.tags.outputs.timestamp_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=min