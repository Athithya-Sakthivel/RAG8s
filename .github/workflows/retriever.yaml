name: retriever-image-ci

on:
  push:
    branches: [main]
    paths:
      - src/services/retriever/**
      - .github/workflows/retriever.yaml
  pull_request:
    paths:
      - src/services/retriever/**
      - .github/workflows/retriever.yaml

permissions:
  contents: read

concurrency:
  group: retriever-image-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TRIVY_IMAGE: ghcr.io/athithya-sakthivel/trivy:0.69.3-safe@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c
  TRIVY_CACHE_DIR: ${{ github.workspace }}/.trivy-cache
  COLLECTOR_IMAGE: otel/opentelemetry-collector-contrib@sha256:a516c26968aa1feb5e5fc0562e3338ea13755cb4f373603226bcc4e276374ad0

jobs:
  build-test-scan-push:
    name: Build, smoke test, scan, publish retriever image
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: staging

    env:
      GIT_PAT: ${{ secrets.GIT_PAT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute Trivy cache key
        id: trivy-key
        shell: bash
        run: |
          set -euo pipefail
          echo "key=trivy-${RUNNER_OS}-$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Prepare Trivy cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${TRIVY_CACHE_DIR}"

      - name: Restore Trivy cache
        uses: actions/cache@v4
        with:
          path: ${{ env.TRIVY_CACHE_DIR }}
          key: ${{ steps.trivy-key.outputs.key }}
          restore-keys: |
            trivy-${{ runner.os }}-

      - name: Compute image metadata (Kolkata style tag, lowercase GHCR user)
        id: image-meta
        shell: bash
        run: |
          set -euo pipefail
          RAW_GHCR_USER="${GHCR_USER:-${{ github.actor }}}"
          GHCR_USER="$(printf '%s' "${RAW_GHCR_USER}" | tr '[:upper:]' '[:lower:]')"
          IMAGE_NAME="${IMAGE_NAME:-retriever}"
          IMAGE_TAG="${IMAGE_TAG:-$(TZ=Asia/Kolkata date +%Y-%m-%d-%H-%M)--$(git rev-parse --short HEAD)}"
          RETRIEVER_IMAGE="ghcr.io/${GHCR_USER}/${IMAGE_NAME}:${IMAGE_TAG}"
          IMAGE_STAGING="ghcr.io/${GHCR_USER}/${IMAGE_NAME}:staging"
          echo "ghcr_user=${GHCR_USER}" >> "$GITHUB_OUTPUT"
          echo "image_name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "retriever_image=${RETRIEVER_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "image_staging=${IMAGE_STAGING}" >> "$GITHUB_OUTPUT"

      - name: Build image (load into runner for smoke tests)
        id: build-image
        uses: docker/build-push-action@v6
        with:
          context: src/services/retriever
          file: src/services/retriever/Dockerfile
          load: true
          push: false
          pull: true
          tags: |
            ${{ steps.image-meta.outputs.retriever_image }}
            ${{ steps.image-meta.outputs.image_staging }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Start isolated test network
        shell: bash
        run: |
          set -euo pipefail
          docker network create retriever-otel-ci >/dev/null 2>&1 || true

      - name: Start OTEL Collector
        shell: bash
        run: |
          set -euo pipefail

          cat >/tmp/retriever-collector.yaml <<'YAML'
          receivers:
            otlp:
              protocols:
                grpc:
                http:

          processors:
            batch: {}

          exporters:
            debug:
              verbosity: detailed

          service:
            pipelines:
              traces:
                receivers: [otlp]
                processors: [batch]
                exporters: [debug]
              metrics:
                receivers: [otlp]
                processors: [batch]
                exporters: [debug]
              logs:
                receivers: [otlp]
                processors: [batch]
                exporters: [debug]
          YAML

          docker run \
            --name retriever-otel-collector \
            -d \
            --network retriever-otel-ci \
            -v /tmp/retriever-collector.yaml:/etc/otelcol-contrib/config.yaml:ro \
            "${COLLECTOR_IMAGE}" \
            --config /etc/otelcol-contrib/config.yaml >/dev/null

      - name: Start retriever container
        shell: bash
        run: |
          set -euo pipefail

          docker run \
            --name retriever-ci \
            -d \
            --network retriever-otel-ci \
            -p 9023:8001 \
            --shm-size=1g \
            -e PORT=8001 \
            -e LOG_LEVEL=INFO \
            -e SERVICE_NAME=retrieval \
            -e SERVICE_VERSION=ci \
            -e ENV=CI \
            -e DEPLOYMENT_ENVIRONMENT=CI \
            -e CLUSTER_NAME=ci \
            -e SERVICE_INSTANCE_ID=ci-1 \
            -e OTEL_EXPORTER_OTLP_ENDPOINT=http://retriever-otel-collector:4317 \
            -e OTEL_TIMEOUT_SECONDS=2 \
            -e OTEL_METRIC_EXPORT_INTERVAL_MS=1000 \
            -e OTEL_METRIC_EXPORT_TIMEOUT_MS=1000 \
            -e OTEL_TRACES_SAMPLER=parentbased_traceidratio \
            -e OTEL_TRACES_SAMPLER_ARG=1.0 \
            -e ENABLE_OTEL_TRACES=true \
            -e ENABLE_OTEL_METRICS=true \
            -e ENABLE_OTEL_LOGS=true \
            -e QDRANT_URL=http://127.0.0.1:65530 \
            -e DENSE_URL=http://127.0.0.1:65531 \
            -e SPARSE_URL=http://127.0.0.1:65532 \
            -e RERANKER_URL=http://127.0.0.1:65533 \
            -e AWS_REGION=us-east-1 \
            -e BEDROCK_MODEL_ID=test-model \
            "${{ steps.build-image.outputs.imageid }}" >/dev/null

      - name: Wait for health endpoint
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 90); do
            if curl -fsS --max-time 2 http://127.0.0.1:9023/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "[ERROR] retriever did not become healthy"
          docker logs --tail 200 retriever-ci || true
          docker logs --tail 200 retriever-otel-collector || true
          exit 1

      - name: Smoke test OTEL path
        shell: bash
        run: |
          set -euo pipefail

          healthz="$(curl -fsS http://127.0.0.1:9023/healthz)"
          readyz="$(curl -fsS http://127.0.0.1:9023/readyz || true)"

          printf '%s' "${healthz}" | grep -q '"status":"ok"'
          printf '%s' "${readyz}" | grep -q '"status"'

          code="$(
            curl -sS --max-time 10 \
              -o /tmp/retriever-invalid.out \
              -w '%{http_code}' \
              -X POST http://127.0.0.1:9023/generate \
              -H 'Content-Type: application/json' \
              -d '{}' || true
          )"

          if [ "${code}" != "422" ]; then
            cat /tmp/retriever-invalid.out || true
            docker logs --tail 200 retriever-ci || true
            docker logs --tail 200 retriever-otel-collector || true
            exit 1
          fi

      - name: Flush and verify telemetry
        shell: bash
        run: |
          set -euo pipefail

          docker stop -t 15 retriever-ci >/dev/null || true
          sleep 2

          app_logs="$(docker logs retriever-ci 2>&1 || true)"
          collector_logs="$(docker logs retriever-otel-collector 2>&1 || true)"

          printf '%s' "${app_logs}" | grep -q 'request.validation_failed'
          printf '%s' "${app_logs}" | grep -q '"trace_id"'
          printf '%s' "${app_logs}" | grep -q '"span_id"'

          printf '%s' "${collector_logs}" | grep -Eq 'ResourceSpans|resourceSpans'
          printf '%s' "${collector_logs}" | grep -Eq 'ResourceMetrics|resourceMetrics'
          printf '%s' "${collector_logs}" | grep -Eq 'ResourceLogs|resourceLogs'
          printf '%s' "${collector_logs}" | grep -q 'http.server.request.count'
          printf '%s' "${collector_logs}" | grep -q 'http.server.request.duration'
          printf '%s' "${collector_logs}" | grep -q 'retrieval.pipeline.duration'

      - name: Scan built image with Trivy (CI-level scan)
        shell: bash
        run: |
          set -euo pipefail
          scan_image="${{ steps.build-image.outputs.imageid }}"
          test -n "${scan_image}"
          ignore_args=()
          if [[ -f src/services/retriever/.trivyignore ]]; then
            ignore_args+=(--ignorefile /workspace/src/services/retriever/.trivyignore)
          elif [[ -f .trivyignore ]]; then
            ignore_args+=(--ignorefile /workspace/.trivyignore)
          fi
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${TRIVY_CACHE_DIR}:/root/.cache/trivy" \
            -v "$PWD:/workspace" \
            -w /workspace \
            "${TRIVY_IMAGE}" \
            image \
            --cache-dir /root/.cache/trivy \
            --scanners vuln \
            --severity CRITICAL \
            --exit-on-eol 1 \
            --exit-code 1 \
            "${ignore_args[@]}" \
            "${scan_image}"

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ steps.image-meta.outputs.ghcr_user }}
          password: ${{ env.GIT_PAT }}

      - name: Push image tags
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          docker push "${{ steps.image-meta.outputs.retriever_image }}"
          docker push "${{ steps.image-meta.outputs.image_staging }}"
