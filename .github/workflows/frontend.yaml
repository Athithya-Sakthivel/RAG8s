name: frontend-image-ci

on:
  push:
    branches: [ main ]
    paths:
      - src/services/frontend/**
  pull_request:
    branches: [ main ]
    paths:
      - src/services/frontend/**
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: frontend-image-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: 681802563986
  AWS_ROLE_ARN: arn:aws:iam::681802563986:role/gh-actions-frontend

  ECR_REPOSITORY: frontend
  IMAGE_NAME: frontend

jobs:
  build-test-scan-push:
    name: Build, test, scan, publish frontend image
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v5.0.0
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Compute image metadata
        id: image-meta
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_TAG="${IMAGE_TAG:-$(TZ=Asia/Kolkata date +%Y-%m-%d-%H-%M)--$(git rev-parse --short HEAD)}"
          REGISTRY_HOST="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          PRIMARY_IMAGE="${REGISTRY_HOST}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          STAGING_IMAGE="${REGISTRY_HOST}/${ECR_REPOSITORY}:staging"

          echo "primary_image=${PRIMARY_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "staging_image=${STAGING_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Build image
        id: build-image
        uses: docker/build-push-action@v7.1.0
        with:
          context: src/services/frontend
          file: src/services/frontend/Dockerfile
          load: true
          push: false
          pull: true
          tags: |
            ${{ steps.image-meta.outputs.primary_image }}
            ${{ steps.image-meta.outputs.staging_image }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Run frontend smoke tests
        shell: bash
        run: |
          set -euo pipefail
          bash src/services/frontend/test.sh

      - name: Scan built image with Trivy
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ steps.build-image.outputs.imageid }}
          format: table
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Configure AWS credentials for ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v6.1.1
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@v2.1.5

      - name: Push image tags
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail

          docker push "${{ steps.image-meta.outputs.primary_image }}"
          docker push "${{ steps.image-meta.outputs.staging_image }}"