name: dense-image-ci

on:
  push:
    branches: [ main ]
    paths:
      - src/services/dense/**
  pull_request:
    branches: [ main ]
    paths:
      - src/services/dense/**
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: dense-image-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: 681802563986
  AWS_ROLE_ARN: arn:aws:iam::681802563986:role/gh-actions-dense-model

  ECR_REPOSITORY: dense-model
  IMAGE_NAME: dense

  TRIVY_VERSION: v0.70.0
  TRIVY_CACHE_DIR: /tmp/trivy-cache

jobs:
  build-test-scan-push:
    name: Build, test, scan, publish dense image
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install Trivy
        shell: bash
        run: |
          set -euo pipefail
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sudo sh -s -- -b /usr/local/bin "${TRIVY_VERSION}"
          trivy --version

      - name: Prepare Trivy cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${TRIVY_CACHE_DIR}"
          chmod 0777 "${TRIVY_CACHE_DIR}"

      - name: Restore Trivy cache
        uses: actions/cache@v4
        with:
          path: /tmp/trivy-cache
          key: trivy-${{ runner.os }}-${{ hashFiles('src/services/dense/Dockerfile', 'src/services/dense/**') }}
          restore-keys: |
            trivy-${{ runner.os }}-

      - name: Compute image metadata
        id: image-meta
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_TAG="${IMAGE_TAG:-$(TZ=Asia/Kolkata date +%Y-%m-%d-%H-%M)--$(git rev-parse --short HEAD)}"
          REGISTRY_HOST="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          PRIMARY_IMAGE="${REGISTRY_HOST}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          STAGING_IMAGE="${REGISTRY_HOST}/${ECR_REPOSITORY}:staging"

          echo "registry_host=${REGISTRY_HOST}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "repo_name=${ECR_REPOSITORY}" >> "$GITHUB_OUTPUT"
          echo "primary_image=${PRIMARY_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "staging_image=${STAGING_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Build image (load into runner for tests)
        id: build-image
        uses: docker/build-push-action@v7.1.0
        with:
          context: src/services/dense
          file: src/services/dense/Dockerfile
          load: true
          push: false
          pull: true
          tags: |
            ${{ steps.image-meta.outputs.primary_image }}
            ${{ steps.image-meta.outputs.staging_image }}
          cache-from: type=gha,scope=dense-model
          cache-to: type=gha,mode=max,scope=dense-model

      - name: Run service tests
        shell: bash
        run: |
          set -euo pipefail
          cd src/services/dense
          export DENSE_MODEL_NAME="${DENSE_MODEL_NAME:-BAAI/bge-small-en-v1.5}"
          export DENSE_DIM="${DENSE_DIM:-384}"
          export DENSE_IMAGE_TAG="${IMAGE_TAG:-${{ steps.image-meta.outputs.image_tag }}}"
          export IMAGE_REPO="${IMAGE_REPO:-${{ steps.image-meta.outputs.repo_name }}}"
          chmod +x test_dense.sh
          TEST_MODE=cpu DENSE_MODEL_NAME="${DENSE_MODEL_NAME}" DENSE_DIM="${DENSE_DIM}" ./test_dense.sh

      - name: Scan built image with Trivy
        shell: bash
        run: |
          set -euo pipefail
          scan_image="${{ steps.build-image.outputs.imageid }}"
          test -n "${scan_image}"

          ignore_args=()
          if [[ -f src/services/dense/.trivyignore ]]; then
            ignore_args+=(--ignorefile src/services/dense/.trivyignore)
          elif [[ -f .trivyignore ]]; then
            ignore_args+=(--ignorefile .trivyignore)
          fi

          trivy image \
            --cache-dir "${TRIVY_CACHE_DIR}" \
            --scanners vuln \
            --severity CRITICAL \
            --exit-on-eol 1 \
            --exit-code 1 \
            "${ignore_args[@]}" \
            "${scan_image}"

      - name: Configure AWS credentials for ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v6.1.1
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@v2.1.5

      - name: Push image tags
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          docker push "${{ steps.image-meta.outputs.primary_image }}"
          docker push "${{ steps.image-meta.outputs.staging_image }}"