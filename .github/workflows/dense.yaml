name: dense-image-ci

on:
  push:
    branches: [ main ]
    paths:
      - src/services/dense/**
      - .github/workflows/dense.yaml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: dense-image-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: 681802563986
  ECR_REPOSITORY: dense-model
  IMAGE_NAME: dense

jobs:
  oidc-debug:
    name: OIDC Token Debug
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Show ref
        run: echo "ref=${{ github.ref }}"
      - name: Request OIDC token (curl)
        id: get_token
        run: |
          set -euo pipefail
          echo "Requesting OIDC token..."
          TOKEN_JSON=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL")
          echo "token=$TOKEN_JSON" >> "$GITHUB_OUTPUT"
      - name: Decode token payload
        run: |
          echo "Decoded token payload:"
          echo "${{ steps.get_token.outputs.token }}" | jq -r '.value' | cut -d'.' -f2 | base64 --decode || true
  build-test-scan-push:
    name: Build, test, scan, publish dense image
    runs-on: ubuntu-24.04
    needs: oidc-debug
    timeout-minutes: 40
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with: { fetch-depth: 1 }
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Compute image metadata
        id: image-meta
        run: |
          set -euo pipefail
          IMAGE_TAG="${IMAGE_TAG:-$(date -u +%Y-%m-%d-%H-%M)--$(git rev-parse --short HEAD)}"
          REGISTRY_HOST="${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          echo "primary_image=${REGISTRY_HOST}/${{ env.ECR_REPOSITORY }}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "staging_image=${REGISTRY_HOST}/${{ env.ECR_REPOSITORY }}:staging" >> "$GITHUB_OUTPUT"
      - name: Build image
        id: build-image
        uses: docker/build-push-action@v7
        with:
          context: src/services/dense
          file: src/services/dense/Dockerfile
          load: true
          push: false
          pull: true
          tags: |
            ${{ steps.image-meta.outputs.primary_image }}
            ${{ steps.image-meta.outputs.staging_image }}
          cache-from: type=gha,scope=dense-model
          cache-to: type=gha,mode=max,scope=dense-model
      - name: Scan built image with Trivy
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ steps.build-image.outputs.imageid }}
          format: table
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1
      - name: Configure AWS credentials for ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v6.1.1
        with:
          role-to-assume: arn:aws:iam::681802563986:role/gh-actions-dense-model
          aws-region: ap-south-1
          role-session-name: github-actions-dense
      - name: Log in to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@v2.1.5
      - name: Push image tags
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "${{ steps.image-meta.outputs.primary_image }}"
          docker push "${{ steps.image-meta.outputs.staging_image }}"
