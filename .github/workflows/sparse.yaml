name: sparse-image-ci

on:
  push:
    branches: [ main ]
    paths:
      - src/services/sparse/**
  pull_request:
    branches: [ main ]
    paths:
      - src/services/sparse/**
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: sparse-image-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: 681802563986
  AWS_ROLE_ARN: arn:aws:iam::681802563986:role/gh-actions-sparse-model

  ECR_REPOSITORY: sparse-model
  IMAGE_NAME: sparse

jobs:
  build-test-scan-push:
    name: Build, test, scan, publish sparse image
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v5.0.0
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Compute image metadata
        id: image-meta
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_TAG="${IMAGE_TAG:-$(TZ=Asia/Kolkata date +%Y-%m-%d-%H-%M)--$(git rev-parse --short HEAD)}"
          REGISTRY_HOST="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          PRIMARY_IMAGE="${REGISTRY_HOST}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          STAGING_IMAGE="${REGISTRY_HOST}/${ECR_REPOSITORY}:staging"

          echo "registry_host=${REGISTRY_HOST}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "repo_name=${ECR_REPOSITORY}" >> "$GITHUB_OUTPUT"
          echo "primary_image=${PRIMARY_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "staging_image=${STAGING_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Build image
        id: build-image
        uses: docker/build-push-action@v7.1.0
        with:
          context: src/services/sparse
          file: src/services/sparse/Dockerfile
          load: true
          push: false
          pull: true
          tags: |
            ${{ steps.image-meta.outputs.primary_image }}
            ${{ steps.image-meta.outputs.staging_image }}
          cache-from: type=gha,scope=sparse-model
          cache-to: type=gha,mode=max,scope=sparse-model

      - name: Run service tests
        shell: bash
        run: |
          set -euo pipefail

          cd src/services/sparse

          export SPARSE_MODEL_NAME="${SPARSE_MODEL_NAME:-prithivida/Splade_PP_en_v1}"
          export SPARSE_BATCH_SIZE="${SPARSE_BATCH_SIZE:-8}"
          export SPARSE_IMAGE_TAG="${IMAGE_TAG:-${{ steps.image-meta.outputs.image_tag }}}"
          export IMAGE_REPO="${IMAGE_REPO:-${{ steps.image-meta.outputs.repo_name }}}"

          chmod +x test_sparse.sh

          TEST_MODE=cpu \
          SPARSE_MODEL_NAME="${SPARSE_MODEL_NAME}" \
          SPARSE_BATCH_SIZE="${SPARSE_BATCH_SIZE}" \
          ./test_sparse.sh

      - name: Scan built image with Trivy
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ steps.build-image.outputs.imageid }}
          format: table
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Configure AWS credentials for ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v6.1.1
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@v2.1.5

      - name: Push image tags
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail

          docker push "${{ steps.image-meta.outputs.primary_image }}"
          docker push "${{ steps.image-meta.outputs.staging_image }}"